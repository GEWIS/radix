# The register's housekeeping is one schedule consumed by one worker, so its jobs run one after another: a nightly
# report regeneration that overruns delays the hourly mailing list sync behind it rather than running alongside it. No
# `--limit`, because a run of `report:generate:full` is one message that takes the better part of an hour, and the
# grace period is long enough to let one finish.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: radix-scheduler-maintenance
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels: { app.kubernetes.io/name: radix-scheduler-maintenance }
    template:
        metadata:
            labels: { app.kubernetes.io/name: radix-scheduler-maintenance }
        spec:
            terminationGracePeriodSeconds: 3600
            containers:
                - name: worker
                  image: abc.docker-registry.gewis.nl/web/radix/app:latest
                  command: ["php", "bin/console", "messenger:consume", "scheduler_maintenance", "-vv", "--time-limit=3600", "--memory-limit=256M"]
                  envFrom:
                      - configMapRef: { name: radix-config }
                      - secretRef: { name: radix-secrets }
                  volumeMounts:
                      - { name: data, mountPath: /app/data }
                  resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits: { memory: 512Mi }
            volumes:
                - name: data
                  persistentVolumeClaim: { claimName: radix-data }
