# One Deployment per transport, mirroring the compose stack. They bypass the image's entrypoint by naming `php`
# directly, so they neither wait for the databases nor migrate: the transports are what they block on, and the
# messages they pick up would fail against a half-migrated schema anyway.
#
# `--time-limit` is what makes a rollout finish: the worker stops on its own after that, and Kubernetes replaces it
# with the new image. terminationGracePeriodSeconds is set above the longest message so a SIGTERM mid-message is
# allowed to finish rather than being cut off.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: radix-messenger-high-priority
spec:
    replicas: 1
    selector:
        matchLabels: { app.kubernetes.io/name: radix-messenger-high-priority }
    template:
        metadata:
            labels: { app.kubernetes.io/name: radix-messenger-high-priority }
        spec:
            terminationGracePeriodSeconds: 120
            containers:
                - name: worker
                  image: abc.docker-registry.gewis.nl/web/radix/app:latest
                  command: ["php", "bin/console", "messenger:consume", "high_priority", "-vv", "--time-limit=600", "--limit=32", "--memory-limit=256M"]
                  envFrom:
                      - configMapRef: { name: radix-config }
                      - secretRef: { name: radix-secrets }
                  volumeMounts:
                      - { name: data, mountPath: /app/data }
                  resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits: { memory: 512Mi }
            volumes:
                - name: data
                  persistentVolumeClaim: { claimName: radix-data }
---
