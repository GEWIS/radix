# Image encoding is heavier and more memory-hungry, so this one recycles sooner and gets more headroom.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: radix-messenger-images
spec:
    replicas: 1
    selector:
        matchLabels: { app.kubernetes.io/name: radix-messenger-images }
    template:
        metadata:
            labels: { app.kubernetes.io/name: radix-messenger-images }
        spec:
            terminationGracePeriodSeconds: 120
            containers:
                - name: worker
                  image: abc.docker-registry.gewis.nl/web/radix/app:latest
                  command: ["php", "bin/console", "messenger:consume", "images", "-vv", "--time-limit=600", "--limit=16", "--memory-limit=512M"]
                  envFrom:
                      - configMapRef: { name: radix-config }
                      - secretRef: { name: radix-secrets }
                  volumeMounts:
                      - { name: data, mountPath: /app/data }
                  resources:
                      requests: { cpu: 250m, memory: 512Mi }
                      limits: { memory: 1Gi }
            volumes:
                - name: data
                  persistentVolumeClaim: { claimName: radix-data }
---
