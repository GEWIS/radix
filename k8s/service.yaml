apiVersion: v1
kind: Service
metadata:
    name: radix-app
spec:
    selector:
        app.kubernetes.io/name: radix-app
    ports:
        - port: 80
          targetPort: http
          name: http
---
# Mailpit, relaying to the real SMTP server. The application talks SMTP to this name in every environment; under
# compose the development override makes the same image catch mail instead of forwarding it.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: radix-mailer
spec:
    replicas: 1
    selector:
        matchLabels: { app.kubernetes.io/name: radix-mailer }
    template:
        metadata:
            labels: { app.kubernetes.io/name: radix-mailer }
        spec:
            containers:
                - name: mailpit
                  image: axllent/mailpit
                  env:
                      - name: MP_SMTP_RELAY_TLS
                        value: "true"
                      - name: MP_SMTP_RELAY_AUTH
                        value: "login"
                      - name: MP_SMTP_RELAY_HOST
                        valueFrom:
                            secretKeyRef: { name: radix-secrets, key: SMTP_SERVER }
                      - name: MP_SMTP_RELAY_PORT
                        valueFrom:
                            secretKeyRef: { name: radix-secrets, key: SMTP_PORT }
                      - name: MP_SMTP_RELAY_USERNAME
                        valueFrom:
                            secretKeyRef: { name: radix-secrets, key: SMTP_USERNAME }
                      - name: MP_SMTP_RELAY_PASSWORD
                        valueFrom:
                            secretKeyRef: { name: radix-secrets, key: SMTP_PASSWORD }
                  ports:
                      - containerPort: 1025
                        name: smtp
                  resources:
                      requests: { cpu: 50m, memory: 64Mi }
                      limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
    name: radix-mailer
spec:
    selector:
        app.kubernetes.io/name: radix-mailer
    ports:
        - port: 1025
          targetPort: smtp
