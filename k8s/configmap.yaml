# Everything that is not a secret. What is missing here on purpose has a default in config/services.yaml — the mail
# display names, the pinned Stripe and Mailman API versions, the watermark tag, the TU/e subnets — and is a code
# change rather than a deployment setting.
apiVersion: v1
kind: ConfigMap
metadata:
    name: radix-config
data:
    APP_ENV: "prod"
    # The cluster's own proxy terminates TLS and forwards over plain HTTP, so Caddy serves port 80 and is told which
    # forwarded headers it may believe. The host matters as much as the scheme: an absolute URL the application builds
    # has to name what the visitor typed, which only survives the proxy in X-Forwarded-Host.
    SERVER_NAME: ":80"
    SYMFONY_TRUSTED_PROXIES: "private_ranges"

    DEFAULT_URI: "https://gewis.nl"
    APP_URL: "https://gewis.nl"
    SERVER_HOSTNAME: "gewis.nl"
    CORS_ALLOW_ORIGIN: "^https://([a-z0-9-]+\\.)?gewis\\.nl$"
    # Any non-empty value serves the maintenance page to everyone, admins included.
    MAINTENANCE: ""

    # Valkey carries the cache, Doctrine's second-level cache and symfony/lock. The lock store has to be the same one
    # for every pod: each schedule is consumed by a Deployment of its own, and during a rollout the outgoing and the
    # incoming pod both hold a lock for a moment.
    VALKEY_DSN: "valkey://radix-valkey:6379"
    LOCK_DSN: "valkey://radix-valkey:6379"

    MAILER_DSN: "smtp://radix-mailer:1025"
    MERCURE_URL: "http://radix-app/.well-known/mercure"
    MERCURE_PUBLIC_URL: "https://gewis.nl/.well-known/mercure"

    MAILMAN_API_ENDPOINT: "http://mailman-core:8001/3.1/"
    LISTMONK_API_ENDPOINT: "http://listmonk:9000/api/"

    # Where Stripe returns somebody to. The site's own name: the sign-up name is a redirect onto the form now, so a
    # return address under it would send a member who has just paid back to the beginning.
    STRIPE_CANCEL_URL: "https://gewis.nl/member/subscribe/checkout/cancelled?stripe_session_id={CHECKOUT_SESSION_ID}"
    STRIPE_SUCCESS_URL: "https://gewis.nl/member/subscribe/checkout/completed?stripe_session_id={CHECKOUT_SESSION_ID}"

    MATOMO_DOMAIN: "https://matomo.gewis.nl"
    # The calendar's identifier, which is public; the API key that reads it is in the Secret.
    DOCKER_GOOGLE_CALENDAR_KEY: "replace-me@group.calendar.google.com"


    MAIL_FROM_ADDRESS: "noreply@gewis.nl"
    MAIL_REPLY_TO_ADDRESS: "secretary@gewis.nl"
    MAIL_TO_CHECKER_RESULT_ADDRESS: "secretary@gewis.nl"
    MAIL_TO_REPORT_ERROR_ADDRESS: "abc@gewis.nl"
    MAIL_TO_SUBSCRIPTION_ADDRESS: "secretary@gewis.nl"
    MAIL_TO_INTERNAL_AFFAIRS_ADDRESS: "cib@gewis.nl"
    MAIL_TO_EXTERNAL_AFFAIRS_ADDRESS: "ceb@gewis.nl"
    MAIL_TO_C4_ADDRESS: "c4@gewis.nl"
    MAIL_TO_GEFLITST_ADDRESS: "geflitst@gewis.nl"
    MAIL_TO_TREASURER_ADDRESS: "penningmeester@gewis.nl"
