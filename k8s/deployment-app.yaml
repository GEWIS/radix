# The pods that serve HTTP. The image's entrypoint waits for both databases before Caddy starts, which is what keeps a
# pod from answering its first request against a database that is not there yet; SKIP_MIGRATIONS stops it doing more
# than wait, because migrating is the Job's business (see job-migrate.yaml) and several replicas starting at once must
# not race each other for it.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: radix-app
spec:
    replicas: 2
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    selector:
        matchLabels:
            app.kubernetes.io/name: radix-app
    template:
        metadata:
            labels:
                app.kubernetes.io/name: radix-app
        spec:
            containers:
                - name: app
                  image: abc.docker-registry.gewis.nl/web/radix/app:latest
                  env:
                      - name: SKIP_MIGRATIONS
                        value: "1"
                  envFrom:
                      - configMapRef: { name: radix-config }
                      - secretRef: { name: radix-secrets }
                  ports:
                      - containerPort: 80
                        name: http
                  # A bare `/` answers with a redirect to the preferred language, which counts as ready. The startup
                  # probe is what gives the entrypoint time to wait for the databases; without it the liveness probe
                  # would kill the pod while it is still waiting.
                  startupProbe:
                      httpGet: { path: /, port: http }
                      periodSeconds: 5
                      failureThreshold: 30
                  readinessProbe:
                      httpGet: { path: /, port: http }
                      periodSeconds: 10
                  livenessProbe:
                      httpGet: { path: /, port: http }
                      periodSeconds: 20
                      failureThreshold: 3
                  volumeMounts:
                      - name: data
                        mountPath: /app/data
                  resources:
                      requests: { cpu: 250m, memory: 512Mi }
                      limits: { memory: 2Gi }
            volumes:
                # Uploads, the public archive mirror and the generated reports. Shared with the workers, which write
                # most of it, so the claim has to be ReadWriteMany.
                - name: data
                  persistentVolumeClaim:
                      claimName: radix-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: radix-data
spec:
    accessModes: ["ReadWriteMany"]
    resources:
        requests:
            storage: 50Gi
