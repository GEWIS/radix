# Valkey, which carries the application cache, Doctrine's second-level cache and the schedule locks. A StatefulSet
# rather than a Deployment for the stable name and the one volume: the locks are only a boundary if every pod reaches
# the same instance.
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: radix-valkey
spec:
    serviceName: radix-valkey
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: radix-valkey
    template:
        metadata:
            labels:
                app.kubernetes.io/name: radix-valkey
        spec:
            containers:
                - name: valkey
                  image: valkey/valkey:9.1-alpine
                  ports:
                      - containerPort: 6379
                        name: valkey
                  volumeMounts:
                      - name: data
                        mountPath: /data
                  readinessProbe:
                      exec:
                          command: ["valkey-cli", "ping"]
                      initialDelaySeconds: 5
                      periodSeconds: 5
                  resources:
                      requests: { cpu: 50m, memory: 128Mi }
                      limits: { memory: 512Mi }
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                  requests:
                      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
    name: radix-valkey
spec:
    selector:
        app.kubernetes.io/name: radix-valkey
    ports:
        - port: 6379
          targetPort: valkey
