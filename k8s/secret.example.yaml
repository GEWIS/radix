# The plaintext input to `kubeseal`, and the one file here that is never applied to a cluster. Fill it in, seal it,
# and throw the filled-in copy away:
#
#     cp secret.example.yaml /tmp/radix-secrets.yaml
#     $EDITOR /tmp/radix-secrets.yaml
#     kubeseal --format yaml --controller-namespace kube-system < /tmp/radix-secrets.yaml > sealedsecret.yaml
#     shred -u /tmp/radix-secrets.yaml
#
# A SealedSecret is encrypted against one cluster's key, so re-sealing is what moving to a different cluster means.
apiVersion: v1
kind: Secret
metadata:
    name: radix-secrets
    namespace: radix
type: Opaque
stringData:
    # `openssl rand -hex 32`
    APP_SECRET: "REPLACE_ME"

    # Both DSNs carry their password, which is what puts them here rather than in the ConfigMap. `role` on the ledger
    # is not a driver parameter: App\Doctrine\Middleware\SetRoleDriver reads it off the parsed DSN and issues
    # `SET ROLE` with it, so the application runs as a least-privileged role rather than as the schema's owner.
    DATABASE_DSN: "postgresql://USER:PASSWORD@postgresql:5432/gewisdb?serverVersion=16&charset=utf8&sslmode=require&role=REPLACE_ME"
    WEB_DATABASE_DSN: "pdo-mysql://USER:PASSWORD@mariadb:3306/gewis?serverVersion=11.8.8-mariadb&charset=utf8mb4&collation=utf8mb4_uca1400_ai_ci"
    MESSENGER_TRANSPORT_DSN: "amqp://USER:PASSWORD@radix-rabbitmq:5672"

    # The hub's signing key. The publisher and subscriber keys are the same secret; the Caddyfile wants all three.
    MERCURE_JWT_SECRET: "REPLACE_ME"
    MERCURE_PUBLISHER_JWT_KEY: "REPLACE_ME"
    MERCURE_SUBSCRIBER_JWT_KEY: "REPLACE_ME"

    # One key per algorithm the external-application flow signs with, each naming its own in `alg`: Ed25519 for EdDSA,
    # P-521 for ES512, and an RSA key each for PS512 and RS512 — `alg` is single-valued, so one RSA key cannot serve
    # both. There is no default anywhere, so an environment without this fails loudly rather than signing with an
    # empty key set.
    EXTERNAL_APP_JWKSET: '{"keys":[]}'

    MAILMAN_API_USERNAME: "REPLACE_ME"
    MAILMAN_API_PASSWORD: "REPLACE_ME"
    LISTMONK_API_USERNAME: "REPLACE_ME"
    LISTMONK_API_PASSWORD: "REPLACE_ME"

    # A restricted key, always: write on "Core Objects: Charges and Refunds", "Payment Links: *" and
    # "Checkout Sessions: Checkout Sessions".
    STRIPE_SECRET_KEY: "REPLACE_ME"
    STRIPE_WEBHOOK_SIGNING_KEY: "REPLACE_ME"
    STRIPE_MEMBERSHIP_PRICE_ID: "REPLACE_ME"

    # Public archive sync (App\Command\Application\SyncPublicArchiveCommand).
    SSH_REMOTE: "REPLACE_ME"
    SSH_USERNAME: "REPLACE_ME"
    SSH_PASSWORD: "REPLACE_ME"

    DOCKER_GOOGLE_API_KEY: "REPLACE_ME"
    # Without a key the infimum request is refused and the panel keeps whatever it last had, so this one may stay
    # empty.
    SUPREMUM_API_KEY: ""

    # The relay Mailpit forwards to.
    SMTP_SERVER: "REPLACE_ME"
    SMTP_PORT: "587"
    SMTP_USERNAME: "REPLACE_ME"
    SMTP_PASSWORD: "REPLACE_ME"

    # RabbitMQ's own credentials, which have to agree with MESSENGER_TRANSPORT_DSN above.
    RABBITMQ_DEFAULT_USER: "REPLACE_ME"
    RABBITMQ_DEFAULT_PASS: "REPLACE_ME"
