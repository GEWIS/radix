# PLACEHOLDER. The `encryptedData` below is not real ciphertext and the controller will reject it; replace this whole
# file by sealing secret.example.yaml against the target cluster:
#
#     kubeseal --format yaml --controller-namespace kube-system < /tmp/radix-secrets.yaml > sealedsecret.yaml
#
# What comes out is safe to commit: only the controller in that cluster holds the key that opens it. The Secret it
# unseals to is named by `template.metadata` below, which is what the Deployments read through `envFrom`.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
    name: radix-secrets
    namespace: radix
spec:
    encryptedData:
        APP_SECRET: PLACEHOLDER_SEAL_ME
        DATABASE_DSN: PLACEHOLDER_SEAL_ME
        WEB_DATABASE_DSN: PLACEHOLDER_SEAL_ME
        MESSENGER_TRANSPORT_DSN: PLACEHOLDER_SEAL_ME
        MERCURE_JWT_SECRET: PLACEHOLDER_SEAL_ME
        MERCURE_PUBLISHER_JWT_KEY: PLACEHOLDER_SEAL_ME
        MERCURE_SUBSCRIBER_JWT_KEY: PLACEHOLDER_SEAL_ME
        EXTERNAL_APP_JWKSET: PLACEHOLDER_SEAL_ME
        MAILMAN_API_USERNAME: PLACEHOLDER_SEAL_ME
        MAILMAN_API_PASSWORD: PLACEHOLDER_SEAL_ME
        LISTMONK_API_USERNAME: PLACEHOLDER_SEAL_ME
        LISTMONK_API_PASSWORD: PLACEHOLDER_SEAL_ME
        STRIPE_SECRET_KEY: PLACEHOLDER_SEAL_ME
        STRIPE_WEBHOOK_SIGNING_KEY: PLACEHOLDER_SEAL_ME
        STRIPE_MEMBERSHIP_PRICE_ID: PLACEHOLDER_SEAL_ME
        SSH_REMOTE: PLACEHOLDER_SEAL_ME
        SSH_USERNAME: PLACEHOLDER_SEAL_ME
        SSH_PASSWORD: PLACEHOLDER_SEAL_ME
        DOCKER_GOOGLE_API_KEY: PLACEHOLDER_SEAL_ME
        SUPREMUM_API_KEY: PLACEHOLDER_SEAL_ME
        SMTP_SERVER: PLACEHOLDER_SEAL_ME
        SMTP_PORT: PLACEHOLDER_SEAL_ME
        SMTP_USERNAME: PLACEHOLDER_SEAL_ME
        SMTP_PASSWORD: PLACEHOLDER_SEAL_ME
        RABBITMQ_DEFAULT_USER: PLACEHOLDER_SEAL_ME
        RABBITMQ_DEFAULT_PASS: PLACEHOLDER_SEAL_ME
    template:
        metadata:
            name: radix-secrets
            namespace: radix
        type: Opaque
