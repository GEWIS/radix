error_reporting = -1
display_errors = 1
display_startup_errors = 1
zend.assertions = 1

; The source is bind-mounted, so a cached file is stale the moment it is edited. Revalidating on every request is
; what makes an edit take effect without restarting the worker.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; See https://docs.docker.com/desktop/features/networking/networking-how-tos/#connect-a-container-to-a-service-on-the-host
; See https://github.com/docker/for-linux/issues/264
; The `client_host` below may optionally be replaced with `discover_client_host=yes`.
;
; Debugging starts on a trigger (the `XDEBUG_TRIGGER` cookie or parameter that the browser extension sets) rather than
; on every request: with `XDEBUG_MODE=debug` set, every request would otherwise block on an IDE that may not be
; listening.
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
