# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
framework:
    validation:
        # The association's own lookup answers for a whole hash rather than for the five-character prefix
        # haveibeenpwned's k-anonymity model sends, so Symfony's validator cannot be pointed at it however its
        # endpoint is set. `App\Validator\User\NotCompromisedPassword` takes its place; this one stays off so nothing
        # that reaches for the constraint of the same name quietly starts calling haveibeenpwned instead.
        not_compromised_password: false
