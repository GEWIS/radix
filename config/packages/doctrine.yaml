# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
doctrine:
    dbal:
        default_connection: database
        # doctrine-bundle keeps one type registry for the whole DBAL rather than one per connection, so a type is
        # declared here even when a single entity on a single connection maps a column to it.
        types:
            stringable_datetime_immutable: App\Doctrine\Types\StringableDateTimeImmutableType
        connections:
            # The ledger, on PostgreSQL: the editable source of truth. The DSN's `role` is not a driver parameter;
            # App\Doctrine\Middleware\SetRoleDriver reads it from the parsed DSN and issues `SET ROLE` with it.
            database:
                url: '%env(resolve:DATABASE_DSN)%'
                profiling_collect_backtrace: '%kernel.debug%'
                options:
                    # Bounds the connection attempt only (libpq `connect_timeout`, MYSQL_OPT_CONNECT_TIMEOUT), so a long
                    # query is unaffected. Without it libpq waits out the TCP timeout and occupies one of the eight
                    # FrankenPHP worker threads for two minutes.
                    !php/const PDO::ATTR_TIMEOUT: 10
            # The website's own database, on PostgreSQL: what the site, the API and the projection read and write after
            # the copy. It shares the ledger's credentials and least-privileged role (the DSN's `role`, handled by
            # the same middleware).
            application:
                url: '%env(resolve:APPLICATION_DSN)%'
                profiling_collect_backtrace: '%kernel.debug%'
                options:
                    !php/const PDO::ATTR_TIMEOUT: 10
            # The MariaDB copy source: the copy command reads it and the fixtures fill it. Removed once the migration
            # is done with it.
            web:
                url: '%env(resolve:WEB_DATABASE_DSN)%'
                profiling_collect_backtrace: '%kernel.debug%'
                options:
                    !php/const PDO::ATTR_TIMEOUT: 10
                    # The copy streams tables without a primary key row by row, which needs the driver to leave
                    # the result on the server instead of buffering it whole.
                    !php/const PDO::MYSQL_ATTR_USE_BUFFERED_QUERY: false
    # The ledger is the default manager, so an unqualified `getRepository()` reaches the wrong one for most of
    # the codebase: use `application` explicitly.
    orm:
        default_entity_manager: database
        entity_managers:
            database:
                connection: database
                # Both schemas were built with Doctrine's DefaultNamingStrategy verbatim. doctrine-bundle's own
                # default, `underscore_number_aware`, would rename every camelCase column (`createdAt` to
                # `created_at`) and the tables with them.
                naming_strategy: doctrine.orm.naming_strategy.default
                # ORM 3 resolves AUTO to IDENTITY on PostgreSQL where ORM 2 resolved it to SEQUENCE. The ledger's id
                # columns are plain INT with no DEFAULT nextval(...), so IDENTITY fails every INSERT. MariaDB's
                # AUTO_INCREMENT needs none of this, which is why the preference belongs to this manager alone.
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: sequence
                dql:
                    string_functions:
                        UNACCENT: App\Doctrine\Functions\Unaccent
                mappings:
                    # One directory, and therefore one entry: `App\Entity\Database\User` is the entity for the accounts
                    # that administer the ledger, and is defined under the ledger's namespace precisely so that it is
                    # mapped here rather than alongside the website's own users.
                    Database:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Database'
                        prefix: 'App\Entity\Database'

            # First, because a repository service looks its manager up in the registry by entity class, and both
            # managers map the website's classes; the one that serves the site has to win.
            application:
                connection: application
                naming_strategy: doctrine.orm.naming_strategy.default
                # `App\Entity\Decision\Member` is the only entity annotated for this: read on nearly every page,
                # written only when the projection follows the ledger. Its region is NONSTRICT_READ_WRITE because
                # those writes go through the ORM and a READ_ONLY region refuses an update outright; a reader may
                # briefly see the version from before a write, which is not worth a lock for data that is rebuilt
                # from the ledger anyway.
                #
                # Do NOT add `User` or `UserRole`: MFA toggles and admin role grants must take effect immediately.
                second_level_cache:
                    enabled: true
                    log_enabled: '%kernel.debug%'
                    region_lifetime: 1800
                    regions:
                        member_region:
                            lifetime: 1800
                            cache_driver:
                                type: pool
                                pool: cache.app
                dql:
                    # Registered on this manager alone: no query on the ledger uses them, and the function classes branch on
                    # the platform behind the query. UNACCENT passes through on MariaDB, where the ai_ci collation
                    # ignores accents; the web fixtures reuse the classes without registering them.
                    string_functions:
                        UNACCENT: App\Doctrine\Functions\Unaccent
                    numeric_functions:
                        MONTH: App\Doctrine\Functions\Month
                        RAND: App\Doctrine\Functions\Rand
                        YEAR: App\Doctrine\Functions\Year
                # One list for both managers, so adding a domain cannot leave the copy target behind.
                mappings: &web_mappings
                    Activity:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Activity'
                        prefix: 'App\Entity\Activity'
                    Application:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Application'
                        prefix: 'App\Entity\Application'
                    Company:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Career'
                        prefix: 'App\Entity\Career'
                    Decision:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Decision'
                        prefix: 'App\Entity\Decision'
                    Education:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Education'
                        prefix: 'App\Entity\Education'
                    Frontpage:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Frontpage'
                        prefix: 'App\Entity\Frontpage'
                    Photo:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Photo'
                        prefix: 'App\Entity\Photo'
                    User:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/User'
                        prefix: 'App\Entity\User'

            # The MariaDB copy source, mapped so the fixtures can fill it; removed once the migration is done with it.
            # After the application manager, whose registry lookup must win for the website's classes.
            web:
                connection: web
                naming_strategy: doctrine.orm.naming_strategy.default
                mappings: *web_mappings

when@test:
    doctrine:
        dbal:
            connections:
                # All three databases move aside, or a test run writes over the development ledger, the copy source
                # and the projection of the ledger. "TEST_TOKEN" is typically set by ParaTest.
                database:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                web:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                application:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        dbal:
            # The ledger and the application connection state their TLS in the DSN, so there is nothing to add for
            # them here.
            connections:
                web:
                    # TLS to the production MariaDB. CAPATH points at the system CA bundle, which is present in the
                    # production image. These are MySQL-specific PDO attributes, so they only apply to this
                    # connection. Merged with the `options` above rather than replacing them.
                    options:
                        !php/const Pdo\Mysql::ATTR_SSL_CAPATH: '/etc/ssl/certs/'
                        !php/const Pdo\Mysql::ATTR_SSL_VERIFY_SERVER_CERT: true
        orm:
            # Both managers parse DQL and both serve pages, so both get the pools. Sharing them is safe: the ORM salts
            # a query cache key with the platform behind the query.
            entity_managers:
                database:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool
                web:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool
                application:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
