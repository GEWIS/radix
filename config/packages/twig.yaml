# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
twig:
    file_name_pattern: '*.twig'
    # Lets base.html.twig inline color-modes.js with `source()`, so the theme is set before the first paint.
    paths:
        '%kernel.project_dir%/assets/js': js
    form_themes:
        - 'bootstrap_5_layout.html.twig'
        - 'form/altcha.html.twig'
        - 'form/api_permissions.html.twig'
        - 'form/board_candidate_collection.html.twig'
        - 'form/bootstrap_floating.html.twig'
        - 'form/collection.html.twig'
        - 'form/colour_vision.html.twig'
        - 'form/date_option_collection.html.twig'
        - 'form/localised_text.html.twig'
        - 'form/poll_option_collection.html.twig'
        - 'form/signup_list_collection.html.twig'
    globals:
        supported_locales: '%kernel.enabled_locales%'
        matomo_domain: '%env(MATOMO_DOMAIN)%'
        external_affairs_email: '%app.email.external_affairs%'
        education_email: '%app.email.education%'
        # The sudo window, so the confirmation page states the expiration without repeating the number that
        # decides it. It was written out as "30 minutes" in two sentences and two languages.
        sudo_idle_seconds: '%app.sudo_idle_ttl%'
        # The build the container was made from. Read through the container rather than from `$_SERVER`, which never
        # contains it: `variables_order` is GPCS, so no environment variable reaches the superglobal.
        git_commit: '%env(string:default::GIT_COMMIT)%'

when@test:
    twig:
        strict_variables: true
