# The ledger's set, on PostgreSQL. Not loaded by Symfony: doctrine/migrations' own format, read when a command names
# it. `em` belongs to the set, so no command has to remember one.
em: 'default'

# Paths are resolved relative to this file. The namespace is what doctrine_migration_versions records its classes by,
# so it cannot be renamed without rewriting every row, and it must differ from the web set's.
migrations_paths:
    'Database\Migrations': '../../../migrations/database'

table_storage:
    table_name: doctrine_migration_versions
    version_column_name: version
    version_column_length: 191
    executed_at_column_name: executed_at
    execution_time_column_name: execution_time

all_or_nothing: true
transactional: true
check_database_platform: true

# Relative to the working directory; only `migrations_paths` above is rewritten.
custom_template: 'migrations/template.tpl'
