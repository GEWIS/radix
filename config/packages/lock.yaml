# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
# Both locks here span containers: the schedule's spans a rolling deploy, and a scheduled command's spans the
# consumers of its transport (see `App\Command\HoldsRunLockTrait`). A `flock` is visible only inside one container,
# so both use the Valkey already used for the cache.
framework:
    lock: '%env(LOCK_DSN)%'

when@test:
    # The same store: `flock` would let two runs that should have excluded each other both proceed.
    framework:
        lock: '%env(LOCK_DSN)%'
