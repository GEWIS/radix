# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
    app.session_prefix: 'gws_sess_'
    # Named rather than left to `session.gc_maxlifetime`, whose twenty-four minutes had an ordinary break ending in
    # a remember-me re-authentication, and a token rotation with it.
    app.session_ttl: 28800
    # How stale a "last used" stamp may get before it is written again. Shared by the two that keep one: the session
    # metadata in Valkey (`framework.session.metadata_update_threshold`) and the `lastUsedAt` of a managed session row
    # (StaleSessionGuardListener). Both write on a request that otherwise changes nothing, and both are read only to
    # report when a session was last seen.
    app.session_last_used_threshold: 180

services:
    app.security.remember_me.main:
        class: App\Security\User\PersistentSignatureRememberMeHandler
        autowire: true
        arguments:
            $userProvider: '@security.user.provider.concrete.user_provider'
            $firewallName: 'main'
            $tokenLifetime: 7776000
            $cookieName: 'GWS_USER_REMEMBERME'

    app.security.remember_me.company:
        class: App\Security\User\PersistentSignatureRememberMeHandler
        autowire: true
        arguments:
            $userProvider: '@security.user.provider.concrete.company_user_provider'
            $firewallName: 'company'
            $tokenLifetime: 604800
            $cookieName: 'GWS_COMPANY_REMEMBERME'

    App\Security\User\HandlerRegistry:
        arguments:
            $handlers:
                main: '@app.security.remember_me.main'
                company: '@app.security.remember_me.company'

    # PHP session storage in Valkey. The session ID is stored on each Session row, letting us destroy a specific
    # device's session by deleting its Valkey key.
    #
    # Connect lazily: the socket only opens on the first session read/write. Doctrine's `PdoSessionHandlerSchemaListener`
    # instantiates the handler purely to type-check it during `doctrine:schema:create`, so an eager connection would
    # reach for Valkey the moment the ORM boots (and CI has none).
    Redis:
        class: \Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(VALKEY_DSN)%'
            - { lazy: true }

    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments:
            - '@Redis'
            - { prefix: '%app.session_prefix%', ttl: '%app.session_ttl%' }
