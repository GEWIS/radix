# Symfony Scheduler replaced the container crontab. One schedule, `default` (src/Scheduler/MainSchedule.php); each
# job states its own due times with `#[AsCronTask]` on the command.
#
# A schedule is generated rather than queued: every consumer computes what is due and would run it in-process, so
# MainSchedule's lock limits it to one. Scaling that worker adds failover but no throughput, which comes from
# `transports:` on each task, which redispatches onto a queue whose consumers do scale. compose.yaml starts one
# dispatcher and a consumer per queue:
#
#     bin/console messenger:consume scheduler_default  (scheduler-default, exactly one)
#     bin/console messenger:consume cron               (cron-worker)
#     bin/console messenger:consume gdpr               (gdpr-worker)
#     bin/console messenger:consume maintenance        (maintenance-worker)
#
# Since those consumers scale, the serial worker no longer provides mutual exclusion, so every scheduled command
# locks its own run through `App\Command\HoldsRunLockTrait`.
#
# Command output reaches the monolog handlers through the worker rather than a per-job file under /data/logs.
