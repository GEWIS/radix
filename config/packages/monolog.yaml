# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: grouped
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # `whatfailuregroup` rather than `group`: an unwritable volume must not also cost the copy on stderr.
            grouped:
                type: whatfailuregroup
                members: [nested, stderr]
            # On the shared `data` volume rather than `var/`, which is a volume per container and is orphaned with
            # it, and named per container so the workers do not rotate one another's file.
            nested:
                type: rotating_file
                max_files: 30
                path: "%kernel.project_dir%/data/logs/%env(LOG_NAME)%.log"
                level: debug
                formatter: monolog.formatter.json
            # So that an outage is visible in `docker logs` and Portainer at all.
            stderr:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
