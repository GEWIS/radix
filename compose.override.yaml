configs:
    init_matomo_db:
        content: |
            mysql_note "Creating Matomo database and user"
            docker_process_sql <<'EOF'
                CREATE DATABASE `${MATOMO_DATABASE_DBNAME:-matomo}`;
                CREATE USER '${MATOMO_DATABASE_USERNAME:-matomo}'@'%' IDENTIFIED BY '${MATOMO_DATABASE_PASSWORD:-matomo}';
                GRANT ALL PRIVILEGES ON `${MATOMO_DATABASE_DBNAME:-matomo}`.* TO '${MATOMO_DATABASE_USERNAME:-matomo}'@'%';
            EOF
    # Isolated database for the PHPUnit integration tests (the `when@test` doctrine config appends the `_test` suffix).
    # The schema itself is built by SchemaTool in App\Tests\Integration\DatabaseTestCase, so no migrations run here.
    init_gewis_test_db:
        content: |
            mysql_note "Creating the isolated PHPUnit test database"
            docker_process_sql <<'EOF'
                CREATE DATABASE IF NOT EXISTS `${DOCTRINE_WEB_DATABASE:-gewis}_test` CHARACTER SET utf8mb4 COLLATE utf8mb4_uca1400_ai_ci;
                GRANT ALL PRIVILEGES ON `${DOCTRINE_WEB_DATABASE:-gewis}_test`.* TO '${DOCTRINE_WEB_USER:-gewis}'@'%';
            EOF
    # The databases Mailman and Listmonk keep beside the ledger. The ledger's own database is the one the image
    # creates from `POSTGRES_DB`; the test database is made by `make test-prepare`, which owns the schema in it.
    init_postgres_databases:
        content: |
            psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER:-gewisdb}" <<-PGSQL
                CREATE DATABASE ${POSTGRES_MAILMAN_DATABASE:-gewisdb_mailman};
                GRANT ALL PRIVILEGES ON DATABASE ${POSTGRES_MAILMAN_DATABASE:-gewisdb_mailman} TO ${POSTGRES_USER:-gewisdb};
                CREATE DATABASE ${POSTGRES_LISTMONK_DATABASE:-gewisdb_listmonk};
                GRANT ALL PRIVILEGES ON DATABASE ${POSTGRES_LISTMONK_DATABASE:-gewisdb_listmonk} TO ${POSTGRES_USER:-gewisdb};
            PGSQL

volumes:
    listmonk_uploads:
    mailman_core:
    mailman_static:
    mailman_web:
    mariadb_data:
    matomo:
    postgres_data:
