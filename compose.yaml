# The production stack, and the base of the development one.
#
# Everything the application needs is in this file, which is what makes it something you can paste into a Portainer
# stack on its own: Portainer supplies the environment, and every `${VAR:?...}` below aborts the deploy with the
# message named there rather than quietly starting on a default.
#
# `docker compose up` in a checkout also loads compose.override.yaml, which turns this into the development stack: it
# adds the build definitions, the databases, the administration tools and the published ports, and it supplies the
# values these guards ask for from `.env.local`. Naming this file with `-f`, as Portainer does, suppresses that file.
#
# Everything the application reads is passed below, including what rarely changes: the mail display names, the pinned
# Stripe and Mailman API versions, the watermark tag and the TU/e subnets are variables like the rest, because rarely
# is not never. Those carry a default here rather than a `${VAR:?...}` guard, since a deployment that says nothing
# about them should still come up. `config/services.yaml` defaults them again, which is what a run outside this stack
# falls back to — a test, or a container compiled for static analysis — so the two are kept in step.
x-app-environment: &app_environment
    # Overridden to `dev` by compose.override.yaml. A Portainer stack has no `.env` to read, so this resolves to
    # `prod` there.
    APP_ENV: "${APP_ENV:-prod}"
    APP_SECRET: "${APP_SECRET:?APP_SECRET must be set}"
    # Which proxies may be believed about the visitor: the addresses or CIDR ranges the proxy in front reaches this
    # container from, comma separated. It terminates TLS and forwards to the port below, so `X-Forwarded-For` is the
    # only thing saying who the visitor is and `X-Forwarded-Proto` the only thing saying they are on HTTPS. A sender
    # that is not named here is believed about neither and the application records the proxy as the visitor, which
    # is why this is guarded rather than defaulted: no value is right everywhere and a wrong one says nothing.
    # Naming more than the proxies is the worse mistake, since anything inside the range may then dictate its own
    # address. Never include TUE_IP_RANGES below, which decides who reaches course material.
    SYMFONY_TRUSTED_PROXIES: "${SYMFONY_TRUSTED_PROXIES:?SYMFONY_TRUSTED_PROXIES must be set to the addresses the proxy forwards from}"
    SERVER_NAME: "${SERVER_NAME:?SERVER_NAME must be set}, app:80"
    DEFAULT_URI: "${DEFAULT_URI:?DEFAULT_URI must be set}"
    CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN must be set}"
    # Set to any non-empty value to serve the maintenance page to everyone, admins included, for work done before the
    # application can serve properly. App-level maintenance is set through the admin interface instead.
    MAINTENANCE: "${MAINTENANCE:-}"
    # The domain the mailing lists are created under on Mailman, which is what it reports back when asked for a list.

    # The ledger, on PostgreSQL: the `default` connection. `role` is not a driver parameter —
    # App\Doctrine\Middleware\SetRoleDriver reads it off the parsed DSN and issues `SET ROLE` with it, so the
    # application runs as a least-privileged role rather than as the owner of the schema it reads.
    DATABASE_DSN: "postgresql://${DOCTRINE_DEFAULT_USER:?DOCTRINE_DEFAULT_USER must be set}:${DOCTRINE_DEFAULT_PASSWORD:?DOCTRINE_DEFAULT_PASSWORD must be set}@${DOCTRINE_DEFAULT_HOST:?DOCTRINE_DEFAULT_HOST must be set}:${DOCTRINE_DEFAULT_PORT:?DOCTRINE_DEFAULT_PORT must be set}/${DOCTRINE_DEFAULT_DATABASE:?DOCTRINE_DEFAULT_DATABASE must be set}?serverVersion=${POSTGRES_VERSION:?POSTGRES_VERSION must be set}&charset=utf8&sslmode=${DOCTRINE_DEFAULT_SSLMODE:?DOCTRINE_DEFAULT_SSLMODE must be set}&role=${DOCTRINE_DEFAULT_ROLE:?DOCTRINE_DEFAULT_ROLE must be set}"
    # Everything else, on MariaDB: the `web` connection. The charset and the collation belong in the DSN because they
    # have to match what the tables were created with; a mismatch makes a schema comparison report every string column
    # as changed.
    WEB_DATABASE_DSN: "pdo-mysql://${DOCTRINE_WEB_USER:?DOCTRINE_WEB_USER must be set}:${DOCTRINE_WEB_PASSWORD:?DOCTRINE_WEB_PASSWORD must be set}@${DOCTRINE_WEB_HOST:?DOCTRINE_WEB_HOST must be set}:${DOCTRINE_WEB_PORT:?DOCTRINE_WEB_PORT must be set}/${DOCTRINE_WEB_DATABASE:?DOCTRINE_WEB_DATABASE must be set}?serverVersion=${DOCTRINE_WEB_VERSION:?DOCTRINE_WEB_VERSION must be set}&charset=${DOCTRINE_WEB_CHARSET:?DOCTRINE_WEB_CHARSET must be set}&collation=${DOCTRINE_WEB_COLLATION:?DOCTRINE_WEB_COLLATION must be set}"

    MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}"
    # The cache, Doctrine's second-level cache and symfony/lock all sit on this one Valkey. The locks have to be
    # visible to every container: each schedule is consumed by a worker of its own, and during a rolling deploy the
    # outgoing and the incoming container both hold one for a moment, which a per-container `flock` cannot see across.
    VALKEY_DSN: &valkey_dsn "valkey://${VALKEY_HOST:-valkey}:${VALKEY_PORT:-6379}"
    LOCK_DSN: *valkey_dsn
    # The `mailer` service below: it relays to the real SMTP server here and catches everything in development, so the
    # application talks to the same address either way.
    MAILER_DSN: "smtp://mailer:25"

    # The Caddyfile's Mercure hub always wants a key, even where nothing publishes: development uses it for hot
    # reload, production leaves the hub closed (no `anonymous`) and idle.
    MERCURE_URL: "${MERCURE_URL:-http://app/.well-known/mercure}"
    MERCURE_PUBLIC_URL: "${MERCURE_PUBLIC_URL:?MERCURE_PUBLIC_URL must be set}"
    MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET must be set}"
    MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_SECRET}"
    MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_JWT_SECRET}"

    # Signing key set for the external-application flow. It has no default anywhere, so an environment without it
    # fails loudly rather than signing with an empty key set.
    EXTERNAL_APP_JWKSET: "${EXTERNAL_APP_JWKSET:?EXTERNAL_APP_JWKSET must be set}"

    # Mailing lists (App\Service\Database\MailmanService, App\Service\Database\ListmonkService).
    MAILMAN_API_ENDPOINT: "${MAILMAN_API_ENDPOINT:?MAILMAN_API_ENDPOINT must be set}"
    MAILMAN_API_VERSION: "${MAILMAN_API_VERSION:-3.1}"
    MAILMAN_API_USERNAME: "${MAILMAN_API_USERNAME:?MAILMAN_API_USERNAME must be set}"
    MAILMAN_API_PASSWORD: "${MAILMAN_API_PASSWORD:?MAILMAN_API_PASSWORD must be set}"
    LISTMONK_API_ENDPOINT: "${LISTMONK_API_ENDPOINT:?LISTMONK_API_ENDPOINT must be set}"
    LISTMONK_API_USERNAME: "${LISTMONK_API_USERNAME:?LISTMONK_API_USERNAME must be set}"
    LISTMONK_API_PASSWORD: "${LISTMONK_API_PASSWORD:?LISTMONK_API_PASSWORD must be set}"

    # Stripe, which settles the membership fee during sign-up. The secret key must be a restricted key; see
    # .env.local.dist for the permissions it needs. Development ships placeholders rather than leaving these empty, so
    # that a checkout without a Stripe account still satisfies the guards.
    # Pinned because Stripe announces a mismatch through a header the SDK re-raises as a PHP warning. The default
    # follows the installed SDK; override it to put a deployment on a different version of the API.
    STRIPE_API_VERSION: "${STRIPE_API_VERSION:-2026-07-29.dahlia}"
    STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY must be set}"
    STRIPE_WEBHOOK_SIGNING_KEY: "${STRIPE_WEBHOOK_SIGNING_KEY:?STRIPE_WEBHOOK_SIGNING_KEY must be set}"
    STRIPE_MEMBERSHIP_PRICE_ID: "${STRIPE_MEMBERSHIP_PRICE_ID:?STRIPE_MEMBERSHIP_PRICE_ID must be set}"
    STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:?STRIPE_CANCEL_URL must be set}"
    STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:?STRIPE_SUCCESS_URL must be set}"

    # Public archive sync over SSH (App\Command\Application\SyncPublicArchiveCommand).
    SSH_REMOTE: "${SSH_REMOTE:?SSH_REMOTE must be set}"
    SSH_USERNAME: "${SSH_USERNAME:?SSH_USERNAME must be set}"
    SSH_PASSWORD: "${SSH_PASSWORD:?SSH_PASSWORD must be set}"

    MATOMO_DOMAIN: "${MATOMO_DOMAIN:?MATOMO_DOMAIN must be set}"
    # The association's own agenda, drawn behind the days bodies ask for in the option calendar. Both fall back to
    # `unknown`, which runs with that layer simply absent.
    GOOGLE_API_KEY: "${GOOGLE_API_KEY:-unknown}"
    GOOGLE_CALENDAR_KEY: "${GOOGLE_CALENDAR_KEY:-unknown}"
    # The Supremum's API, which the infimum is drawn from. Without a key the request is refused and the panel keeps
    # whatever it last had, so the key is optional.
    SUPREMUM_API_HOST: "${SUPREMUM_API_HOST:-https://supremum.gewis.nl}"
    SUPREMUM_API_KEY: "${SUPREMUM_API_KEY:-}"

    # Course material. The subnets are the arrangement under which the department shares its exams — on campus, or
    # signed in as a member — and the tag is written into every watermarked download so a copy found elsewhere can be
    # recognised as ours. Deliberately not a secret: it is meant to be found.
    TUE_IP_RANGES: "${TUE_IP_RANGES:-131.155.0.0/16,100.64.0.0/10}"
    WATERMARK_TAG: "${WATERMARK_TAG:-GEWIS-EDU}"

    # The subnets `ROLE_DATABASE_ADMIN` and `ROLE_DATABASE_READ_ONLY` are granted on, comma separated, CIDR notation.
    # Never the same list as TUE_IP_RANGES above: that one is as wide as a university, and a value that wide restricts
    # nothing here. Addresses in SYMFONY_TRUSTED_PROXIES are refused whatever this says. Empty restricts nothing.
    REGISTER_IP_RANGES: "${REGISTER_IP_RANGES:-}"

    # Who the application writes as, and who it writes to. An address has to be named by the deployment; the display
    # name beside it is defaulted, because a deployment that says nothing should still sign its mail readably.
    MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS must be set}"
    MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Study Association GEWIS}"
    MAIL_REPLY_TO_SECRETARY_ADDRESS: "${MAIL_REPLY_TO_SECRETARY_ADDRESS:?MAIL_REPLY_TO_SECRETARY_ADDRESS must be set}"
    MAIL_REPLY_TO_SECRETARY_NAME: "${MAIL_REPLY_TO_SECRETARY_NAME:-Secretary}"
    MAIL_TO_CHECKER_RESULT_ADDRESS: "${MAIL_TO_CHECKER_RESULT_ADDRESS:?MAIL_TO_CHECKER_RESULT_ADDRESS must be set}"
    MAIL_TO_CHECKER_RESULT_NAME: "${MAIL_TO_CHECKER_RESULT_NAME:-Secretary}"
    MAIL_TO_REPORT_ERROR_ADDRESS: "${MAIL_TO_REPORT_ERROR_ADDRESS:?MAIL_TO_REPORT_ERROR_ADDRESS must be set}"
    MAIL_TO_REPORT_ERROR_NAME: "${MAIL_TO_REPORT_ERROR_NAME:-Database Wizards}"
    MAIL_TO_SUBSCRIPTION_ADDRESS: "${MAIL_TO_SUBSCRIPTION_ADDRESS:?MAIL_TO_SUBSCRIPTION_ADDRESS must be set}"
    MAIL_TO_SUBSCRIPTION_NAME: "${MAIL_TO_SUBSCRIPTION_NAME:-Secretary}"
    MAIL_TO_INTERNAL_AFFAIRS_ADDRESS: "${MAIL_TO_INTERNAL_AFFAIRS_ADDRESS:?MAIL_TO_INTERNAL_AFFAIRS_ADDRESS must be set}"
    MAIL_TO_INTERNAL_AFFAIRS_NAME: "${MAIL_TO_INTERNAL_AFFAIRS_NAME:-Internal Affairs Officer}"
    MAIL_TO_EXTERNAL_AFFAIRS_ADDRESS: "${MAIL_TO_EXTERNAL_AFFAIRS_ADDRESS:?MAIL_TO_EXTERNAL_AFFAIRS_ADDRESS must be set}"
    MAIL_TO_EXTERNAL_AFFAIRS_NAME: "${MAIL_TO_EXTERNAL_AFFAIRS_NAME:-External Affairs Officer}"
    MAIL_TO_C4_ADDRESS: "${MAIL_TO_C4_ADDRESS:?MAIL_TO_C4_ADDRESS must be set}"
    MAIL_TO_C4_NAME: "${MAIL_TO_C4_NAME:-C4}"
    MAIL_TO_GEFLITST_ADDRESS: "${MAIL_TO_GEFLITST_ADDRESS:?MAIL_TO_GEFLITST_ADDRESS must be set}"
    MAIL_TO_GEFLITST_NAME: "${MAIL_TO_GEFLITST_NAME:-GEFLITST}"
    MAIL_TO_GEFLITST_PLANKA_ADDRESS: "${MAIL_TO_GEFLITST_PLANKA_ADDRESS:?MAIL_TO_GEFLITST_PLANKA_ADDRESS must be set}"
    MAIL_TO_GEFLITST_PLANKA_NAME: "${MAIL_TO_GEFLITST_PLANKA_NAME:-GEFLITST (Planka)}"
    MAIL_TO_GEFLITST_PLANKA_KEY: "${MAIL_TO_GEFLITST_PLANKA_KEY:?MAIL_TO_GEFLITST_PLANKA_KEY must be set}"
    MAIL_TO_TREASURER_ADDRESS: "${MAIL_TO_TREASURER_ADDRESS:?MAIL_TO_TREASURER_ADDRESS must be set}"
    MAIL_TO_TREASURER_NAME: "${MAIL_TO_TREASURER_NAME:-Treasurer}"

    # Unset, each of these sizes itself to the host's core count, which on a shared machine means the whole machine:
    # threads, workers and a libvips pool per encode all multiply. Sized for a four-core share. Threads and GOMAXPROCS
    # move with the CPU limit, workers with the memory one, since every worker holds a booted kernel.
    FRANKENPHP_CONFIG: |
        num_threads ${FRANKENPHP_NUM_THREADS:-12}
        max_threads ${FRANKENPHP_MAX_THREADS:-24}
    # `num` leaves the remaining `num_threads` for requests served outside worker mode. Without
    # `max_consecutive_failures`, a worker that fatals on boot is restarted indefinitely. Instead the process stops
    # and the healthcheck reports it.
    FRANKENPHP_WORKER_CONFIG: |
        num ${FRANKENPHP_WORKER_NUM:-8}
        max_consecutive_failures 10
    # Only recent Go versions read the cgroup CPU limit, so name it rather than depend on the image's.
    GOMAXPROCS: "${GOMAXPROCS:-4}"
    # Go sizes its heap against the machine, not the cgroup, so without this the collector does not react before the
    # container is killed at APP_MEMORY_LIMIT. Set below that limit, since it bounds the Go heap only.
    GOMEMLIMIT: "${GOMEMLIMIT:-1600MiB}"
    # libvips defaults its pool to the core count, which costs a core per encode with no gain on a single web-sized
    # image. Scale IMAGE_WORKER_REPLICAS instead, which the container limits can bound.
    VIPS_CONCURRENCY: "${VIPS_CONCURRENCY:-1}"
    # A worker thread keeps whatever a request leaves behind, so it is retired after this many. Request count is
    # only a proxy for memory, and the only bound on a slow leak below APP_MEMORY_LIMIT, so it is set under the
    # default of 500. Lower it if that limit is ever reached; each retirement costs one kernel boot.
    FRANKENPHP_LOOP_MAX: "${FRANKENPHP_LOOP_MAX:-250}"

x-app: &app
    image: "abc.docker-registry.gewis.nl/web/radix/app:${RADIX_VERSION:-latest}"
    restart: unless-stopped
    networks:
        - radix_network
    depends_on:
        mailer:
            condition: service_started
        valkey:
            condition: service_healthy
        rabbitmq:
            condition: service_healthy
    environment:
        <<: *app_environment

x-worker-volumes: &worker_volumes
    - data:/app/data

# Merged per worker below so each carries its own replica count under one rollout policy. Counts are a deployment
# decision, so each is an environment variable.
#
# The limit is per container, so total host usage is replicas times limit. Raising MAINTENANCE_WORKER_REPLICAS
# costs the same as raising WORKER_MEMORY_LIMIT by the same factor. Ten containers at the defaults.
#
# 512m suffices because these run with `opcache.enable_cli` unset, so unlike the application container they hold no
# opcode cache, only their own `--memory-limit` plus a baseline. The container limit catches a run that overshoots
# before PHP stops it.
x-worker-deploy: &worker_deploy
    replicas: 1
    resources:
        limits:
            cpus: "${WORKER_CPU_LIMIT:-1.0}"
            memory: "${WORKER_MEMORY_LIMIT:-512m}"
    update_config:
        parallelism: 1
        delay: 15s
        order: start-first

x-worker: &worker
    <<: *app
    entrypoint: []
    volumes: *worker_volumes
    # Workers skip the entrypoint (and thus migrations); wait for the app, which runs them. Restated in full
    # because the `<<` merge replaces depends_on completely.
    depends_on:
        mailer:
            condition: service_started
        valkey:
            condition: service_healthy
        rabbitmq:
            condition: service_healthy
        app:
            condition: service_healthy
    deploy: *worker_deploy
    healthcheck:
        disable: true

services:
    app:
        <<: *app
        # Without a limit the out-of-memory killer selects across the whole host rather than this container.
        deploy:
            resources:
                limits:
                    cpus: "${APP_CPU_LIMIT:-4.0}"
                    memory: "${APP_MEMORY_LIMIT:-2g}"
        volumes:
            - caddy_data:/data
            - caddy_config:/config
            - data:/app/data
        # The proxy in front of the Docker host terminates TLS and forwards gewis.nl here; analytics.gewis.nl goes to
        # Matomo on 9212. Nothing else is published, so the application is only ever reached through that proxy.
        ports:
            - target: 80
              published: 9210
              protocol: tcp
    messenger-high-priority:
        <<: *worker
        deploy:
            <<: *worker_deploy
            replicas: ${HIGH_PRIORITY_WORKER_REPLICAS:-1}
        command: [ "php", "bin/console", "messenger:consume", "high_priority", "-vv", "--time-limit=600", "--limit=32", "--memory-limit=256M" ]
    messenger-normal-priority:
        <<: *worker
        deploy:
            <<: *worker_deploy
            replicas: ${NORMAL_PRIORITY_WORKER_REPLICAS:-1}
        command: [ "php", "bin/console", "messenger:consume", "normal_priority", "-vv", "--time-limit=600", "--limit=32", "--memory-limit=256M" ]
    messenger-bulk:
        <<: *worker
        deploy:
            <<: *worker_deploy
            replicas: ${BULK_WORKER_REPLICAS:-1}
        command: [ "php", "bin/console", "messenger:consume", "bulk", "-vv", "--time-limit=600", "--limit=32", "--memory-limit=256M" ]
    messenger-images:
        <<: *worker
        # Above the shared limit: libvips allocates outside PHP's limit, so the `--memory-limit` below does not bound
        # this worker's peak. Each replica adds a libvips pool, so scaling costs CPU as well as memory.
        # Image encoding is heavier and more memory-hungry, so recycle the worker sooner and give it more headroom.
        deploy:
            <<: *worker_deploy
            replicas: ${IMAGE_WORKER_REPLICAS:-1}
            resources:
                limits:
                    cpus: "${IMAGE_WORKER_CPU_LIMIT:-2.0}"
                    memory: "${IMAGE_WORKER_MEMORY_LIMIT:-1536m}"
        command: [ "php", "bin/console", "messenger:consume", "images", "-vv", "--time-limit=600", "--limit=16", "--memory-limit=512M" ]
    # Must stay at one replica: a schedule is generated rather than queued, and MainSchedule's lock lets only one
    # consumer advance it, so a second replica would do nothing. It only dispatches onto the queues below, so one
    # is also enough.
    scheduler-default:
        <<: *worker
        deploy:
            <<: *worker_deploy
            replicas: 1
            # Only dispatches; never boots a command.
            resources:
                limits:
                    cpus: "${SCHEDULER_CPU_LIMIT:-0.5}"
                    memory: "${SCHEDULER_MEMORY_LIMIT:-256m}"
        command: [ "php", "bin/console", "messenger:consume", "scheduler_default", "-vv", "--time-limit=600", "--limit=32", "--memory-limit=256M" ]
    # Jobs that must run close to their due time. Two consumers so a long run does not delay the every-minute ones.
    # The commands lock themselves, so a second consumer never causes a second run of the same command.
    cron-worker:
        <<: *worker
        deploy:
            <<: *worker_deploy
            replicas: ${CRON_WORKER_REPLICAS:-2}
        command: [ "php", "bin/console", "messenger:consume", "cron", "-vv", "--time-limit=600", "--limit=32", "--memory-limit=256M" ]
    # Personal-data deletion on its own queue and worker log, so deletions can be audited from one log. Short and
    # nightly, so one consumer.
    gdpr-worker:
        <<: *worker
        deploy:
            <<: *worker_deploy
            replicas: ${GDPR_WORKER_REPLICAS:-1}
        command: [ "php", "bin/console", "messenger:consume", "gdpr", "-vv", "--time-limit=600", "--limit=32", "--memory-limit=256M" ]
    # No `--limit` and an hour of `--time-limit`, because `app:decision:generate` is one message running most of an
    # hour. Two consumers because the half-hourly and hourly jobs here fall inside that run and would queue behind it.
    maintenance-worker:
        <<: *worker
        # Twice the short-job workers' `--memory-limit`, because the projection rebuild loads the ledger it replays.
        deploy:
            <<: *worker_deploy
            replicas: ${MAINTENANCE_WORKER_REPLICAS:-2}
            resources:
                limits:
                    cpus: "${MAINTENANCE_WORKER_CPU_LIMIT:-1.0}"
                    memory: "${MAINTENANCE_WORKER_MEMORY_LIMIT:-768m}"
        command: [ "php", "bin/console", "messenger:consume", "maintenance", "-vv", "--time-limit=3600", "--memory-limit=512M" ]
    # Analytics, on its own hostname: the proxy sends analytics.gewis.nl to the port below. It is part of this stack
    # rather than a separate one because the image is built and published beside the application's, and the site's
    # tracker points at whatever MATOMO_DOMAIN says. Its database is not in this stack; the credentials below name a
    # schema on the same MariaDB server the website uses.
    matomo:
        image: "abc.docker-registry.gewis.nl/web/radix/matomo:${RADIX_VERSION:-latest}"
        restart: unless-stopped
        environment:
            MATOMO_DATABASE_HOST: "${MATOMO_DATABASE_HOST:?MATOMO_DATABASE_HOST must be set}"
            MATOMO_DATABASE_PORT: "${MATOMO_DATABASE_PORT:?MATOMO_DATABASE_PORT must be set}"
            MATOMO_DATABASE_USERNAME: "${MATOMO_DATABASE_USERNAME:?MATOMO_DATABASE_USERNAME must be set}"
            MATOMO_DATABASE_PASSWORD: "${MATOMO_DATABASE_PASSWORD:?MATOMO_DATABASE_PASSWORD must be set}"
            MATOMO_DATABASE_DBNAME: "${MATOMO_DATABASE_DBNAME:?MATOMO_DATABASE_DBNAME must be set}"
            # Whether to reach that server over TLS. 1 on anything but a database in the same stack.
            MATOMO_DATABASE_SSL: "${MATOMO_DATABASE_SSL:-1}"
        deploy:
            resources:
                limits:
                    cpus: "${MATOMO_CPU_LIMIT:-2.0}"
                    memory: "${MATOMO_MEMORY_LIMIT:-768m}"
        volumes:
            - matomo:/var/www/html:rw
        networks:
            - radix_network
        ports:
            - target: 80
              published: 9212
              protocol: tcp
    # The application always talks SMTP to this name. Here it is a Postfix that accepts the message into a local
    # queue and relays it on to the real SMTP server; development replaces this with a Mailpit that catches
    # everything instead. The queue is what a relay outage costs us: Postfix holds the mail and retries rather than
    # handing the failure back to whoever sent it.
    mailer:
        image: juanluisbaptiste/postfix
        restart: unless-stopped
        environment:
            SMTP_SERVER: "${SMTP_SERVER:?SMTP_SERVER must be set}"
            SMTP_PORT: "${SMTP_PORT:?SMTP_PORT must be set}"
            SMTP_USERNAME: "${SMTP_USERNAME:?SMTP_USERNAME must be set}"
            SMTP_PASSWORD: "${SMTP_PASSWORD:?SMTP_PASSWORD must be set}"
            # What Postfix calls itself when it greets the relay, and what an unqualified address gets completed
            # with, so a message is attributable to the deployment that sent it rather than to a container id.
            SERVER_HOSTNAME: "${SERVER_HOSTNAME:?SERVER_HOSTNAME must be set}"
            TZ: "${TZ:-Europe/Amsterdam}"
            # The image asks for opportunistic TLS, which a relay that answers without `STARTTLS` silently gets away
            # with. The credentials above are sent on this connection, so require it instead. `POSTFIX_`-prefixed
            # variables are written to `main.cf` under the name that follows.
            POSTFIX_smtp_tls_security_level: "encrypt"
        ports:
            - target: 25
              protocol: tcp
        networks:
            - radix_network
        # Long enough for Postfix to hand over what it has already accepted before the container goes away.
        stop_grace_period: 60s
    valkey:
        image: valkey/valkey:9.1-alpine
        restart: unless-stopped
        hostname: valkey
        volumes:
            - valkey_data:/data
        networks:
            - radix_network
        ports:
            - target: 6379
              protocol: tcp
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            start_period: 10s
            timeout: 10s
            interval: 5s
            retries: 5
    rabbitmq:
        image: rabbitmq:4.3-alpine
        restart: unless-stopped
        hostname: rabbitmq
        environment:
            RABBITMQ_NODENAME: rabbit@rabbitmq
            RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}"
            RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - radix_network
        ports:
            - target: 5672
              protocol: tcp
        healthcheck:
            test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
            start_period: 10s
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    caddy_data:
    caddy_config:
    data:
    matomo:
    rabbitmq_data:
    valkey_data:

networks:
    radix_network:
