name: "🐛 Bug Report"
description: Report a bug found while using the GEWIS website or the GEWIS database.
labels: ["Type: Bug", "Status: Triage"]
type: "Bug"
body:
    -   type: dropdown
        id: application
        attributes:
            label: Where did you run into this?
            description: The website is everything under `gewis.nl`; the database is the member administration under `/database`.
            options:
                - The website (GEWISWEB)
                - The member database (GEWISDB)
                - Both
                - I am not sure
        validations:
            required: true
    -   type: dropdown
        id: module
        attributes:
            label: Which part of the application does this concern?
            description: Leave this empty if you do not know; it is triaged for you.
            multiple: true
            options:
                - Activity
                - Application
                - Career
                - Checker
                - Database
                - Decision
                - Education
                - Frontpage
                - Photo
                - Report
                - User
    -   type: textarea
        id: current-behavior
        attributes:
            label: Current behaviour
            description: A description of what is currently happening, including screenshots and other useful information (**DO NOT INCLUDE PRIVATE INFORMATION**).
            placeholder: Currently...
        validations:
            required: true
    -   type: textarea
        id: desired-behavior
        attributes:
            label: Desired behaviour
            description: A clear description of what you think should happen.
            placeholder: In this situation, I expected ...
    -   type: textarea
        id: reproduction
        attributes:
            label: Steps to reproduce
            description: Clearly describe which steps or actions you have taken to arrive at the problem. If you have some experience with the code, please link to the specific pieces of code or fork [this repo](https://github.com/GEWIS/radix), create a failing test case, and then link to your fork.
            placeholder: I did X, then Y, before arriving at Z, when ERROR ...
        validations:
            required: true
    -   type: input
        id: version
        attributes:
            label: Application version
            description: Check [the website](https://gewis.nl/admin) to determine the version and short commit hash.
            placeholder: ex. v2.8.2 (3dde2979b)
        validations:
            required: true
    -   type: dropdown
        id: os
        attributes:
            label: What operating system(s) are you seeing the problem on?
            multiple: true
            options:
                - Linux
                - macOS
                - Windows
                - Other
    -   type: dropdown
        id: browsers
        attributes:
            label: What browser(s) are you seeing the problem on?
            multiple: true
            options:
                - Brave
                - Chrome
                - Firefox
                - Microsoft Edge
                - Safari
                - Other
    -   type: textarea
        id: other
        attributes:
            label: Other information
            description: Any other details? Things like browser and operating system version should go here.
