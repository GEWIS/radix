name: "✨ Feature Request"
description: Suggest a feature or enhancement to improve the GEWIS website or the GEWIS database.
labels: ["Type: Idea"]
type: "Feature"
body:
    -   type: dropdown
        id: application
        attributes:
            label: What would this be for?
            description: The website is everything under `gewis.nl`; the database is the member administration under `/database`.
            options:
                - The website (GEWISWEB)
                - The member database (GEWISDB)
                - Both
                - I am not sure
        validations:
            required: true
    -   type: dropdown
        id: module
        attributes:
            label: Which part of the application does this concern?
            description: Leave this empty if you do not know; it is triaged for you.
            multiple: true
            options:
                - Activity
                - Application
                - Career
                - Checker
                - Database
                - Decision
                - Education
                - Frontpage
                - Photo
                - Report
                - User
    -   type: textarea
        id: feature
        attributes:
            label: What would you like?
            description: A clear description of the feature or enhancement wanted.
            placeholder: I'd like to be able to...
        validations:
            required: true
    -   type: textarea
        id: reason
        attributes:
            label: Why is this needed?
            description: A clear description of why this would be useful to have.
            placeholder: I want this because...
    -   type: textarea
        id: other
        attributes:
            label: Other information
            placeholder: Any other details?
