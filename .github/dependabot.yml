version: 2
updates:
    -   package-ecosystem: "composer"
        directory: "/"
        schedule:
            interval: "weekly"
        open-pull-requests-limit: 10
        cooldown:
            default-days: 7
            semver-major-days: 30
            semver-minor-days: 7
            semver-patch-days: 7
            include:
                - "*"
        groups:
            symfony:
                patterns:
                    - "symfony/*"
                    - "symfonycasts/*"
            doctrine:
                patterns:
                    - "doctrine/*"
                    - "doctrineencryptbundle/*"
            api-platform:
                patterns:
                    - "api-platform/*"
            dev-tools:
                patterns:
                    - "phpstan/*"
                    - "spaze/phpstan-disallowed-calls"
                    - "tomasvotruba/type-coverage"
                    - "phpunit/*"
                    - "gewis/gewisphp-coding-standards"

    -   package-ecosystem: "docker"
        directory: "/"
        schedule:
            interval: "weekly"
        open-pull-requests-limit: 10
        cooldown:
            default-days: 7

    -   package-ecosystem: "docker"
        directory: "/docker/matomo"
        schedule:
            interval: "weekly"
        open-pull-requests-limit: 10
        cooldown:
            default-days: 7

    # The published API client, the one npm manifest in the repository. Both CI jobs install from the lockfile, so
    # without this its pins are what gets built and shipped to every consumer for as long as nobody remembers it.
    -   package-ecosystem: "npm"
        directory: "/packages/radix-client"
        schedule:
            interval: "weekly"
        open-pull-requests-limit: 10
        cooldown:
            default-days: 7
            semver-major-days: 30
            semver-minor-days: 7
            semver-patch-days: 7

    -   package-ecosystem: "github-actions"
        directory: "/"
        schedule:
            interval: "weekly"
        open-pull-requests-limit: 10
        cooldown:
            default-days: 7
