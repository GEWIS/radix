name: Check migrations and seed

# Runs whenever an entity, migration, or fixture changes. On a slim app + databases stack it:
#  - applies the migrations + seed from the base branch up to the head branch (and back down again), and
#  - verifies every entity change has a matching migration committed (i.e. no schema drift).
# Nothing else the application talks to — the broker, the mail catcher, the analytics, the sync-based mail and list
# services — is needed to exercise migrations or fixtures, so only the app, the databases, and the cache the ORM's
# second level reads and writes through are started.
#
# The "which paths changed" decision lives in the `changes` job below rather than in an `on.pull_request.paths`
# filter. A path filter stops the workflow from running at all, and a workflow that never runs never reports its
# check: as a required check in the branch protection rules that leaves every unrelated pull request waiting on a
# status that will never arrive. Running always and skipping the expensive job through `if:` reports it as skipped
# instead, which branch protection accepts as a pass.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared compose file set for the docker compose invocations below. `.env.local` is passed the way the Makefile
  # passes it: `.env` holds almost nothing, so the values compose.yaml's guards ask for come from that file, which the
  # "Prepare the checkout" step below creates. The order is the one compose itself loads them in -- production, then
  # the development layer over it -- because the last file wins: named the other way round, compose.yaml puts the
  # production volume back over `/app/data` and the application starts without its keys.
  COMPOSE_FILES: --env-file .env --env-file .env.local --file compose.yaml --file compose.override.yaml
  # The tag compose.override.yaml gives the development image; built below rather than by compose.
  APP_IMAGE: abc.docker-registry.gewis.nl/web/radix/app:development
  # One set per database, each naming its own connection. Mirrors the Makefile.
  DEFAULT_MIGRATIONS: --configuration=config/packages/migrations/default.yaml
  WEB_MIGRATIONS: --configuration=config/packages/migrations/web.yaml

permissions: {}

jobs:
  # The paths that used to sit in `on.pull_request.paths`, evaluated over the pull request's own diff (from the merge
  # base, the same range the path filter used).
  changes:
    name: Detect entity, migration, and fixture changes
    runs-on: ubuntu-latest
    permissions:
        contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The head commit rather than the merge commit, so a pull request with conflicts -- which has no merge ref
          # to check out -- still gets an answer here instead of failing the check it is supposed to unblock.
          ref: ${{ github.event.pull_request.head.sha }}
          # Both ends of the range have to be present locally for the diff below, which reads trees and no blobs.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check whether entities, migrations, or fixtures changed
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" \
            | grep -Eq '^(src/(Entity|DataFixtures)/.*\.php|migrations/.*\.php)$'; then
            echo "Entities, migrations, or fixtures changed; the migration and seed check will run."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing that affects the schema or the seed changed; the migration and seed check will be skipped."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  migration_seed:
    name: Check migrations and seed
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    permissions:
        contents: read

    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # `.env.local` is not committed, and it is where the development values live. A missing `var/` bind-mount
      # source is created as root, which the container user then cannot write.
      - name: Prepare the checkout
        run: |
          make setuplocalenv
          mkdir -p var
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Before the build rather than after, so both databases initialise while buildx works.
      - name: Start the databases
        run: docker compose $COMPOSE_FILES up --detach --quiet-pull postgresql mariadb valkey

      # Not through `docker compose up --build`: reaching the Actions cache needs credentials the runner only puts
      # in an action's environment, so compose ignored `cache_from` and rebuilt from scratch every run. The scope is
      # the one docker-build.yml's `app` leg writes on main. The uid and gid are the runner's, or the container user
      # cannot write the bind-mounted checkout.
      - name: Build the development image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: radix_app_development
          build-args: |
            USER_UID=${{ env.HOST_UID }}
            USER_GID=${{ env.HOST_GID }}
          cache-from: type=gha,scope=app
          load: true
          push: false
          tags: ${{ env.APP_IMAGE }}

      # --no-deps keeps this lightweight: only what the console needs starts, not everything else it depends on.
      - name: Start the application
        run: docker compose $COMPOSE_FILES up --detach --no-build --no-deps app

      # The entrypoint installs `vendor/`, waits for both databases and migrates before printing this marker, and
      # `up --detach` returns long before it does; exec'ing in between is what failed the next step on "Dependencies
      # are missing". Ten minutes because a cold runner installs without a composer cache. Polled rather than
      # followed: `logs --follow` writes nothing more once the marker is out.
      - name: Wait for the application
        run: |
          for i in $(seq 1 300); do
            if docker compose $COMPOSE_FILES logs app 2>/dev/null | grep -q 'PHP app ready!'; then
              echo "The application has finished starting."
              exit 0
            fi
            if [ -z "$(docker compose $COMPOSE_FILES ps --quiet --status running app)" ]; then
              echo "::error::The app container stopped before it finished starting"
              docker compose $COMPOSE_FILES logs app
              exit 1
            fi
            sleep 2
          done
          echo "::error::The application did not become ready in time"
          docker compose $COMPOSE_FILES logs app
          exit 1

      - name: migrate base
        run: make migrate

      - name: get migration status
        # `current` prints "<version> - <description>"; only the version is something to migrate back to.
        run: |
          MIGRATION_BASE_DEFAULT=$(docker compose $COMPOSE_FILES exec -T app bin/console doctrine:migrations:current --no-interaction $DEFAULT_MIGRATIONS | sed 's/[[:space:]]-[[:space:]].*//' | tr -d '[:space:]')
          echo "Default is at: $MIGRATION_BASE_DEFAULT"
          echo "MIGRATION_BASE_DEFAULT=$MIGRATION_BASE_DEFAULT" >> $GITHUB_ENV
          MIGRATION_BASE_WEB=$(docker compose $COMPOSE_FILES exec -T app bin/console doctrine:migrations:current --no-interaction $WEB_MIGRATIONS | sed 's/[[:space:]]-[[:space:]].*//' | tr -d '[:space:]')
          echo "Web is at: $MIGRATION_BASE_WEB"
          echo "MIGRATION_BASE_WEB=$MIGRATION_BASE_WEB" >> $GITHUB_ENV

      # Seeds the databases only; `make seed` would also drive the sync-based Mailman and Listmonk services, which
      # `--no-deps` deliberately never started. Each connection has its own loader and its own fixture group: the
      # bundle's takes one entity manager at a time, and the website's own drops the foreign key checks its purge
      # cannot resolve in order.
      - name: seed base
        run: |
          docker compose $COMPOSE_FILES exec -T app bin/console app:fixtures:load --no-interaction
          docker compose $COMPOSE_FILES exec -T app bin/console app:decision:generate

      - name: Record the base dependency set
        id: deps
        run: echo "lock=$(sha256sum composer.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # `clean: false` keeps the untracked tree the running stack is bound to: `vendor/`, `var/` and `.env.local`.
      - name: Checkout head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            clean: false
            persist-credentials: false

      # Compiled from the base branch's sources, and dev-mode freshness does not track excluded entity classes.
      - name: Discard the base branch's compiled container
        run: rm -rf var/cache

      - name: Install the head branch's dependencies
        env:
          BASE_LOCK: ${{ steps.deps.outputs.lock }}
        run: |
          if [ "$(sha256sum composer.lock | cut -d' ' -f1)" = "$BASE_LOCK" ]; then
            echo "composer.lock is unchanged; the dependencies installed for the base branch still apply."
            exit 0
          fi
          echo "composer.lock changed; reinstalling the dependencies."
          docker compose $COMPOSE_FILES exec -T app composer install --prefer-dist --no-progress --no-interaction

      - name: migrate head
        run: make migrate

      - name: ensure migrations are up to date
        # Regenerate migrations from the current entities; any output here means an
        # entity changed without a matching migration being committed.
        run: |
          make migration-diff
          if git status --porcelain | grep -q 'migrations/'; then
            echo "::error::Entity changes detected without a matching migration. Run 'make migration-diff' locally and commit the generated migration(s)."
            git status --porcelain | grep 'migrations/'
            git status --porcelain | grep 'migrations/' | awk '{ print $2 }' | while read -r migration; do
              echo "::group::$migration"
              cat "$migration"
              echo "::endgroup::"
            done
            exit 1
          fi
          echo "All migrations are up to date."

      - name: seed head
        run: |
          docker compose $COMPOSE_FILES exec -T app bin/console app:fixtures:load --no-interaction
          docker compose $COMPOSE_FILES exec -T app bin/console app:decision:generate

      - name: revert to base migration
        run: |
          docker compose $COMPOSE_FILES exec -T app bin/console doctrine:migrations:migrate --no-interaction $DEFAULT_MIGRATIONS $MIGRATION_BASE_DEFAULT
          docker compose $COMPOSE_FILES exec -T app bin/console doctrine:migrations:migrate --no-interaction $WEB_MIGRATIONS $MIGRATION_BASE_WEB

      - name: stop
        run: docker compose $COMPOSE_FILES down
