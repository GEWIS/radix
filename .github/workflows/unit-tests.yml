name: PHP Unit Tests

# Only run this action when pushing to main or on pull requests (creation, synchronisation, and reopening).
on:
    push:
        branches:
            - main
    pull_request:

# Cancel running jobs that have become stale through updates to the ref (e.g., pushes to a pull request).
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    phpunit:
        name: PHPUnit
        runs-on: ubuntu-latest
        permissions:
            contents: read

        # Both engines, because both are production: the ledger's rules are PostgreSQL queries, and the rest of the
        # application relies on MariaDB for custom DQL functions, named locks and `uca1400` columns that SQLite cannot
        # reproduce. The `when@test` doctrine configuration puts each connection on its own `_test` database, and
        # dama/doctrine-test-bundle rolls every test back so one schema and one seed serve the whole run.
        services:
            postgresql:
                image: postgres:16
                env:
                    POSTGRES_USER: gewisdb
                    POSTGRES_PASSWORD: gewisdb
                    POSTGRES_DB: gewisdb
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready --username=gewisdb"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

            mariadb:
                image: mariadb:11.8
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: gewis
                    MARIADB_USER: gewis
                    MARIADB_PASSWORD: gewis
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

            # symfony/lock points at Valkey in every environment, including this one; see config/packages/lock.yaml.
            valkey:
                image: valkey/valkey:8-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="valkey-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            # php-vips dlopens libvips at runtime; without it the only image driver cannot load and every test that
            # touches an image fails. The course document pipeline shells out to `pdftoppm` and draws its watermark in
            # DejaVu Sans Bold; every other environment gets those from the image, but PHPUnit runs on the bare runner.
            # Together they pull in some 9.5 MB of archives, and the mirror the runners point at regularly collapses to
            # a few tens of kB/s, which has cost this job over four minutes on its own. The archives are keyed on the
            # exact versions apt resolves, so the mirror is only asked for them when those versions change.
            -   name: Resolve the packages to install
                id: apt
                run: |
                    set -o pipefail
                    sudo apt-get update
                    apt-get install --no-install-recommends --print-uris --yes \
                      fonts-dejavu-core libvips42t64 poppler-utils \
                      | awk '/\.deb/ { gsub(/'"'"'/, "", $1); print $1, $2 }' \
                      | sort > "${RUNNER_TEMP}/debs.txt"
                    echo "key=$(sha256sum "${RUNNER_TEMP}/debs.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

            -   name: Cache the package archives
                id: apt-cache
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ${{ runner.temp }}/debs
                    key: apt-${{ runner.os }}-${{ steps.apt.outputs.key }}

            -   name: Download the package archives
                if: steps.apt-cache.outputs.cache-hit != 'true'
                # In parallel, because the throttling is per connection: what takes minutes one file at a time comes
                # down in seconds over eight of them.
                run: |
                    mkdir -p "${RUNNER_TEMP}/debs"
                    cd "${RUNNER_TEMP}/debs"
                    xargs -P 8 -n 2 sh -c 'curl -fsSL -o "$2" "$1"' _ < "${RUNNER_TEMP}/debs.txt"

            -   name: Install libvips, poppler, and the watermark font
                run: |
                    shopt -s nullglob
                    debs=("${RUNNER_TEMP}"/debs/*.deb)
                    if [ ${#debs[@]} -gt 0 ]; then
                        sudo apt-get install -y --no-install-recommends "${debs[@]}"
                    fi
                    # An empty list is what a renamed package looks like, and the tests would fail much later with an
                    # unhelpful `dlopen` error, so check here instead.
                    dpkg -s fonts-dejavu-core libvips42t64 poppler-utils > /dev/null

            -   name: Install PHP
                uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
                with:
                    php-version: '8.5'
                    extensions: 'amqp, apcu, calendar, curl, ffi, gd, intl, opcache, pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, pgsql, redis, zip'

            -   name: Setup problem matchers for PHPUnit
                run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            -   name: Install dependencies with Composer
                uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
                with:
                    composer-options: '--no-scripts'

            -   name: Load environment variables
                uses: c-py/action-dotenv-to-setenv@925b5d99a3f1e4bd7b4e9928be4e2491e29891d9 # v5
                with:
                    env-file: .env.test

            -   name: Create the isolated ledger test database
                env:
                    PGPASSWORD: gewisdb
                # Only the empty database; the schema is built from the mapping metadata below. The name is the one
                # `.env.test` points at, with the `_test` suffix `when@test` appends.
                run: |
                    psql --host=127.0.0.1 --port=5432 --username=gewisdb --dbname=gewisdb \
                      --command="CREATE DATABASE gewisdb_test;"

            -   name: Create the isolated website test database
                env:
                    MYSQL_PWD: root
                # As above, this only creates the empty `_test` database (the `when@test` doctrine config targets it)
                # and grants the application user.
                run: |
                    mysql --host=127.0.0.1 --port=3306 --user=root \
                      --execute="CREATE DATABASE IF NOT EXISTS \`gewis_test\` CHARACTER SET utf8mb4 COLLATE utf8mb4_uca1400_ai_ci; GRANT ALL PRIVILEGES ON \`gewis_test\`.* TO 'gewis'@'%'; FLUSH PRIVILEGES;"

            -   name: Prepare the test databases (schemas + fixtures)
                env:
                    APP_ENV: test
                # The schemas are built from the mapping metadata (no migrations); dama/doctrine-test-bundle then rolls
                # back each test, so this seed is loaded once for the whole run. Each connection is seeded by its own
                # command, as `make test-prepare` does: every fixture names the database it seeds, the bundle's loader
                # takes one entity manager at a time and is pointed at that manager's group, and the website's own
                # loader drops the foreign key checks its purge cannot resolve in dependency order. The decision
                # projection is filled by replaying the ledger, because its listeners stand down while the fixtures
                # load.
                run: |
                    bin/console doctrine:schema:create --em=default
                    bin/console doctrine:schema:create --em=web
                    bin/console app:fixtures:load --no-interaction
                    bin/console app:decision:generate

            -   name: Cache the built front-end assets
                id: assets-cache
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        var/sass
                        var/typescript
                        assets/vendor
                        assets/fonts/fontawesome
                        assets/sprites/fontawesome
                        assets/js/bootstrap.bundle.min.js
                    key: assets-${{ hashFiles('assets/**', '.swcrc', 'importmap.php', 'composer.lock') }}

            -   name: Build the front-end assets
                if: steps.assets-cache.outputs.cache-hit != 'true'
                env:
                    APP_ENV: test
                    SWC_VERSION: v1.15.47
                # The controller and frontpage tests render full pages, so base.html.twig and app.scss resolve the
                # Font Awesome fonts/sprites and Bootstrap bundle (copied out of vendor/ by assets:update), the
                # importmap's vendored JS such as the live-component CSS (importmap:install), and the sass/TypeScript
                # compiled to var/sass and var/typescript. None of that is committed and composer ran with
                # --no-scripts, so it is all built here.
                run: |
                    composer run-script assets:update
                    bin/console importmap:install
                    sudo curl -sSL -o /usr/local/bin/swc "https://github.com/swc-project/swc/releases/download/${SWC_VERSION}/swc-linux-x64-gnu"
                    sudo chmod +x /usr/local/bin/swc
                    bin/console sass:build
                    bin/console typescript:build

            -   name: Run PHPUnit
                env:
                    APP_ENV: test
                run: bin/phpunit
