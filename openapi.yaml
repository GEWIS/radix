        '406':
          description: 'The `Accept` header named no contract version, named one older than 5.0.0, or could not be parsed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      summary: 'Get an activity'
      description: 'A single activity by identifier. An activity that has never been approved, and one the board has unpublished, are both not public and answer 404 — the same as an identifier that names nothing.'
      parameters:
        -
          name: id
