openapi: 3.1.0
info:
  title: 'GEWIS API'
  description: "The API of GEWIS: the association's register of members, bodies and decisions, and the activities and photos of its website. Every path is read with a bearer token belonging to an API principal, and what that principal may read is decided per permission."
  termsOfService: 'https://gewis.nl'
  contact:
    email: abc@gewis.nl
  license:
    name: 'GNU GENERAL PUBLIC LICENSE Version 3'
    url: 'https://github.com/GEWIS/radix/blob/main/LICENSE.txt'
  version: 5.0.0
servers:
  -
    url: 'https://gewis.nl'
    description: 'Production environment'
  -
    url: 'https://test.gewis.nl'
    description: 'Test environment'
  -
    url: 'http://localhost'
    description: 'Local environment'
paths:
  /api/activities:
    get:
      operationId: api_activities
      tags:
        - Activity
      responses:
        '200':
          description: 'Activity collection'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status: { $ref: '#/components/schemas/ResponseStatusEnum' }
                  data: { type: array, items: { $ref: '#/components/schemas/Activity' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403':
          description: 'The principal does not hold the permission this endpoint needs.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: 'No bearer token was given, or it is not known. The body is empty.'
          headers:
            WWW-Authenticate:
              description: 'The challenge, always `Bearer realm="/api"`.'
              schema:
                type: string
        '429':
          description: 'The principal asked for more than it is allowed in a minute. `Retry-After` says how long to wait.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: 'Something went wrong. Most likely permanently.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '406':
          description: 'The `Accept` header named no contract version, named one older than 5.0.0, or could not be parsed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      summary: 'Get activities'
      description: 'The publicly visible activities, paged. Upcoming ones by default, the one starting soonest first; `past=true` asks for the ones that have already finished, the most recent first. `category` narrows to a single category and `organ` to the body organising it, by its identifier; a `category` naming no known category is ignored rather than refused. A cancelled activity is listed, with `cancelled` set; an activity the board unpublished is not listed at all.'
      parameters:
        -
          name: past
          in: query
          description: 'Ask for the activities that have already finished, most recent first, instead of the upcoming ones. A value that is not recognisably true is read as false rather than refused.'
          required: false
          deprecated: false
          schema:
            type: boolean
            default: false
          style: form
          explode: true
        -
          name: category
          in: query
          description: 'Narrow the list to a single category, e.g. `social-drink` or `career`, as `category` on an activity states it. A value naming no known category is ignored rather than refused.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: organ
          in: query
          description: 'Narrow the list to the body organising the activity, by the id `/bodies/{id}` answers to. A value that is not a whole number is ignored rather than refused.'
          required: false
          deprecated: false
          schema:
            type: integer
          style: form
          explode: true
        -
          name: page
          in: query
          description: 'The collection page number'
          required: false
          deprecated: false
          schema:
            type: integer
            default: 1
          style: form
          explode: true
        -
          name: itemsPerPage
          in: query
          description: 'The number of items per page'
          required: false
          deprecated: false
          schema:
            type: integer
            default: 100
            minimum: 0
            maximum: 500
          style: form
          explode: true
        -
          name: X-Api-Version
          in: header
          description: 'The contract version this consumer speaks. Required: this endpoint did not exist before the contract was versioned. `Accept: application/vnd.gewis.gewisdb+json;version=5.0.0` says the same thing, but OpenAPI requires tooling to ignore an `Accept` parameter, so it cannot be offered here.'
          required: true
          deprecated: false
          schema:
            type: string
            examples:
              - 5.0.0
          style: simple
          explode: false
