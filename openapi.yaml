      summary: 'Get board functions'
      description: 'Every function a board member can be installed in, with its Dutch and English name. Requires a client version through the `Accept` header.'
      parameters:
        -
          name: X-Api-Version
          in: header
          description: 'The contract version this consumer speaks. `Accept: application/vnd.gewis.gewisdb+json;version=4.3.3` says the same thing and is what consumers of this endpoint have always sent.'
