components:
  schemas:
    Activity:
      type: object
      description: 'An activity, as its live (approved) revision describes it. A cancelled activity is still listed, with `cancelled` set; one the board unpublished is not listed at all. Every human-readable field is an {en, nl} pair, and a value the organiser never filled in is null rather than substituted from the other language.'
      properties:
        id:
          description: 'Identifier of the activity. Stable across every revision of it, so it keeps naming the same activity after an edit is approved.'
          type: integer
        name:
          description: 'The name of the activity, per language.'
          type: object
          properties:
            en:
              type:
                - string
                - 'null'
            nl:
              type:
                - string
                - 'null'
        description:
          description: 'The description of the activity, per language. Markdown, as the organiser wrote it.'
          type: object
          properties:
            en:
              type:
                - string
                - 'null'
            nl:
              type:
                - string
                - 'null'
        location:
          description: 'Where the activity takes place, per language.'
          type: object
          properties:
            en:
              type:
                - string
                - 'null'
            nl:
              type:
                - string
                - 'null'
        costs:
          description: 'What attending costs, per language. Prose rather than an amount: an activity may be free, priced per option, or settled afterwards.'
          type: object
          properties:
            en:
              type:
                - string
                - 'null'
            nl:
              type:
                - string
                - 'null'
        beginTime:
          description: 'When the activity starts, in the `Y-m-d\TH:i:sP` format.'
          type: string
        endTime:
          description: 'When the activity ends, in the `Y-m-d\TH:i:sP` format.'
          type: string
        category:
          description: 'The single category the activity is filed under, e.g. `social-drink` or `career`. `uncategorised` is only ever carried by activities that predate categories.'
          type: string
        organ:
          description: 'The body organising the activity, or null when no body does.'
          type:
            - object
            - 'null'
          properties:
            id:
              type: integer
            abbreviation:
              type: string
            name:
              type: string
        company:
          description: 'The company organising the activity, or null when no company does. Naming a company is presentation only; it never means the company owns the activity.'
          type:
            - object
            - 'null'
          properties:
            id:
              type: integer
            name:
              type: string
        requireGEFLITST:
          description: "Whether the activity needs the association's photography committee present."
          type: boolean
        requireZettle:
          description: 'Whether the activity needs a card terminal.'
          type: boolean
        cancelled:
          description: 'Whether the board has cancelled the activity. A cancelled activity stays announced and keeps its schedule; all sign-up interaction on it is frozen.'
          type: boolean
        labels:
          description: 'The labels the activity carries, e.g. that it is in English or that it is alcohol-free.'
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: object
                properties:
                  en: { type: [string, 'null'] }
                  nl: { type: [string, 'null'] }
        signupLists:
          description: 'The sign-up lists of the live revision, with the window each is open for. Empty when the activity is not signed up for. `capacity` is only meaningful with `limitedCapacity`.'
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: object
                properties:
                  en: { type: [string, 'null'] }
                  nl: { type: [string, 'null'] }
              openDate:
                type: string
                format: date-time
              closeDate:
                type: string
                format: date-time
              onlyGEWIS:
                type: boolean
              limitedCapacity:
                type: boolean
              capacity:
                type:
                  - integer
                  - 'null'
    AlbumPhoto:
      type: object
      description: 'A photo in a published album. Reached through its album, which is what decides whether it may be seen.'
      properties:
        id:
          type: integer
        dateTime:
          description: 'When the photo was taken, in the `Y-m-d\TH:i:sP` format.'
          type: string
        artist:
          description: 'Who took the photo, as the camera recorded it.'
          type:
            - string
            - 'null'
        camera:
          type:
            - string
            - 'null'
        aspectRatio:
          description: "The photo's height divided by its width, as measured when it was uploaded."
          type:
            - number
            - 'null'
        url:
          description: "Where the image itself is served from, for the same bearer token that read this collection. The last segment of that address is the rendition; swap it for another of the pipeline's variants to be served the photo at a different size."
          type: string
        tags:
          description: 'Who and what is in the photo: a member tag names the member, a body tag the body.'
          type: array
          items:
            oneOf:
              -
                type: object
                properties:
                  lidnr: { type: integer }
                  full_name: { type: string }
              -
                type: object
                properties:
                  organId: { type: integer }
                  abbreviation: { type: string }
    BoardMember:
      type: object
      description: 'A board installation. Current ones by default; `includeFormer` asks for the boards that came before.'
      properties:
        lidnr:
          description: 'Membership number of the board member.'
          type: integer
        full_name:
          type: string
        function:
          description: 'The function held. It is in Dutch because that is the language the decision was made in; `/boardFunctions` lists every value there is with its translations.'
          type: string
        installDate:
          description: 'When the installation took effect, in the `Y-m-d\TH:i:sP` format.'
          type: string
        releaseDate:
          description: 'When the member was relieved of the function, in the `Y-m-d\TH:i:sP` format, or null if they have not been.'
          type:
            - string
            - 'null'
        dischargeDate:
          description: 'When the board year was discharged, in the `Y-m-d\TH:i:sP` format, or null if it has not been.'
          type:
            - string
            - 'null'
        current:
          description: 'Whether the member is serving in this function today.'
          type: boolean
    Body:
      type: object
      description: 'A body of the association: a committee, a fraternity, an advisory board, or any other organ a decision founded. The register calls it an organ; the API calls it a body. An abbreviation is reused when a body is founded again years later, so the identifier is the only stable handle on one.'
      properties:
        id:
          description: 'The identifier the register gives the body. An abbreviation is reused when a body is founded again years after the last one was abrogated, so this is the only stable handle on one.'
          type: integer
        abbreviation:
          description: 'What the body is called in short, and what its members call it.'
          type: string
        name:
          type: string
        type:
          description: 'The kind of body: one of `committee`, `avc`, `fraternity`, `kcc`, `avw`, `rva` or `sc`.'
          type: string
        foundationDate:
          description: 'When the founding decision took effect, in the `Y-m-d\TH:i:sP` format.'
          type: string
        abrogationDate:
          description: 'When the body was abrogated, in the `Y-m-d\TH:i:sP` format, or null if no decision has abrogated it. A date in the future is a body that is still running.'
          type:
            - string
            - 'null'
        active:
          description: 'Whether the body exists today, which is what `abrogationDate` says read against the calendar. Stated separately so a consumer does not have to compare dates to find out.'
          type: boolean
    BodyMember:
      type: object
      description: 'A member installed in a body, seen from the body. A member holding two functions in the same body is two rows.'
      properties:
        lidnr:
          description: 'Membership number of the installed member.'
          type: integer
        full_name:
          type: string
        function:
          description: 'The function held in the body. It is in Dutch because that is the language the decision was made in and the register stores it verbatim; `/organFunctions` lists every value there is with its translations.'
          type: string
        installDate:
          description: 'When the installation took effect, in the `Y-m-d\TH:i:sP` format.'
          type: string
        dischargeDate:
          description: 'When the member was discharged from the body, in the `Y-m-d\TH:i:sP` format, or null if no decision has discharged them. A date in the future is an installation that is still running.'
          type:
            - string
            - 'null'
        current:
          description: 'Whether the member sits in the body today. Always true unless `includeDischarged` asked for the installations that have ended.'
          type: boolean
    Error:
      type: object
      description: 'A representation of common errors.'
      properties:
        title:
          readOnly: true
          description: 'A short, human-readable summary of the problem.'
          type:
            - string
            - 'null'
        detail:
          readOnly: true
          description: 'A human-readable explanation specific to this occurrence of the problem.'
          type:
            - string
            - 'null'
        status:
          type:
            - integer
            - 'null'
          examples:
            - 404
          default: 400
        instance:
          readOnly: true
          description: 'A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.'
          type:
            - string
            - 'null'
        type:
          readOnly: true
          description: 'A URI reference that identifies the problem type'
          type: string
    Keyholder:
      type: object
      description: "A member holding a key to the association's rooms. Currently valid grants by default; `includeExpired` asks for the ones that have run out or been withdrawn."
      properties:
        lidnr:
          description: 'Membership number of the keyholder.'
          type: integer
        full_name:
          type: string
        expirationDate:
          description: 'When the granting expires, in the `Y-m-d\TH:i:sP` format.'
          type: string
        withdrawnDate:
          description: 'When the key was handed back, in the `Y-m-d\TH:i:sP` format, or null if it never was.'
          type:
            - string
            - 'null'
        current:
          description: 'Whether the granting is in force today.'
          type: boolean
    MailingList:
      type: object
      description: 'A mailing list of the association. The name is its identifier, and it is case-sensitive.'
      properties:
        name:
          description: 'The name the list is known by, on the servers that carry it as much as here.'
          type: string
        description:
          description: 'What the list is for, in English and in Dutch. The association is bilingual and neither description is a translation of the other, so both are always given.'
          type: object
          properties:
            en:
              type: string
            nl:
              type: string
    MailingListMember:
      type: object
      description: 'A subscription to a mailing list. A member subscribed under two addresses is two rows, which is why the membership number does not identify one.'
      properties:
        lidnr:
          description: 'Membership number of the subscriber.'
          type: integer
        full_name:
          type: string
        email:
          description: 'The address that is subscribed. A distribution group is not one without it, so `mailinglists_members_read` hands it out on its own; in practice the register projects the address the membership carries, so granting this permission grants sight of it.'
          type: string
    Member:
      type: object
      description: 'A member of the association. Which fields are present depends on the permissions the token carries: a field it may not see is absent rather than null.'
      properties:
        lidnr:
          description: 'Membership number.'
          type: integer
        full_name:
          type: string
        family_name:
          type: string
        middle_name:
          type: string
        initials:
          type: string
        given_name:
          type: string
        generation:
          description: 'The calendar year in which the member joined.'
          type: integer
        hidden:
          type: boolean
        deleted:
          description: 'Always false unless the principal holds `members_deleted`.'
          type: boolean
        expiration:
          description: 'When the membership expires, in the `Y-m-d\TH:i:sP` format.'
          type: string
        organs:
          description: 'The bodies the member is currently installed in. Present only with `organs_members_read`, and on `/members` only when `includeOrgans` asks for it.'
          type: array
          items:
            type: object
            properties:
              organ:
                type: object
                properties:
                  id: { type: integer }
                  abbreviation: { type: string }
              function:
                type: string
              installDate:
                type: string
                format: date-time
              dischargeDate:
                type:
                  - string
                  - 'null'
                format: date-time
              current:
                type: boolean
        email:
          type:
            - string
            - 'null'
        birthdate:
          description: 'Date of birth, in the `Y-m-d\TH:i:sP` format.'
          type:
            - string
            - 'null'
        is_16_plus:
          type:
            - boolean
            - 'null'
        is_18_plus:
          type:
            - boolean
            - 'null'
        is_21_plus:
          type:
            - boolean
            - 'null'
        keyholder:
          description: "Whether the member currently holds a key to the association's rooms."
          type:
            - boolean
            - 'null'
        membership_type:
          description: 'One of `ordinary`, `external`, `graduate` or `honorary`.'
          type:
            - string
            - 'null'
    MemberBody:
      type: object
      description: 'A member installed in a body, seen from the member.'
      properties:
        body:
          description: 'The body the member is installed in, named by the id `/bodies/{id}` answers to.'
          type: object
          properties:
            id:
              type: integer
            abbreviation:
              type: string
            name:
              type: string
            type:
              type: string
        function:
          description: 'The function held in the body. It is in Dutch because that is the language the decision was made in and the register stores it verbatim; `/organFunctions` lists every value there is with its translations.'
          type: string
        installDate:
          description: 'When the installation took effect, in the `Y-m-d\TH:i:sP` format.'
          type: string
        dischargeDate:
          description: 'When the member was discharged from the body, in the `Y-m-d\TH:i:sP` format, or null if no decision has discharged them. A date in the future is an installation that is still running.'
          type:
            - string
            - 'null'
        current:
          description: 'Whether the member sits in the body today. Always true unless `includeDischarged` asked for the installations that have ended.'
          type: boolean
    PhotoAlbum:
      type: object
      description: "A published photo album. Sub-albums are listed alongside their parents and carry their parent's identifier, so a consumer can rebuild the tree from one listing."
      properties:
        id:
          type: integer
        name:
          type: string
        startDateTime:
          description: 'When the earliest photo in the album was taken, in the `Y-m-d\TH:i:sP` format. Null for an album that holds no dated photos yet.'
          type:
            - string
            - 'null'
        endDateTime:
          description: 'When the last photo in the album was taken, in the `Y-m-d\TH:i:sP` format.'
          type:
            - string
            - 'null'
        parent:
          description: 'The album this one sits below, or null for a top-level album.'
          type:
            - integer
            - 'null'
        photoCount:
          description: 'The photos in this album itself, which is what `/api/photos/albums/{id}/photos` pages through. Photos of a sub-album count towards that sub-album.'
          type: integer
        albumCount:
          description: 'The number of published albums directly below this one.'
          type: integer
        coverUrl:
          description: "Where the album's cover mosaic is served from, for the same bearer token that read this album. The last segment of that address is the rendition; swap it for another of the pipeline's variants to be served the cover at a different size. Null for an album no cover has been generated for yet."
          type:
            - string
            - 'null'
        children:
          description: "The published albums directly below this one, each described as it would be in the listing. Null rather than empty on the listing itself, where `albumCount` says how many there are: a listing that carried every album's children would carry the whole tree twice over."
          type:
            - array
            - 'null'
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              startDateTime:
                type:
                  - string
                  - 'null'
                format: date-time
              endDateTime:
                type:
                  - string
                  - 'null'
                format: date-time
              photoCount:
                type: integer
              albumCount:
                type: integer
              coverUrl:
                type:
                  - string
                  - 'null'
        photosUrl:
          description: 'Where the photos of this album are read from, paged. Null on the listing, for the same reason `children` is.'
          type:
            - string
            - 'null'
    PhotoOfTheWeek:
      type: object
      description: 'The photo the association voted best of the week that just passed. Its public copy needs no token; a hidden photo of the week is a missing resource.'
      properties:
        week:
          description: 'The first day of the week that was voted on, in the `Y-m-d\TH:i:sP` format.'
          type: string
        photo:
          description: 'The photo itself, and the album it was taken out of.'
          type: object
          properties:
            id:
              type: integer
            dateTime:
              type: string
              format: date-time
            artist:
              type:
                - string
                - 'null'
            camera:
              type:
                - string
                - 'null'
            aspectRatio:
              type:
                - number
                - 'null'
            album:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
        url:
          description: "The public copy of the photo of the week, which needs no credential of any kind: it is the same address the association's own front page serves it from to a visitor who is not logged in. Null while that copy is not on disk, which is what a hidden photo of the week looks like on the filesystem."
          type:
            - string
            - 'null'
    ResponseStatusEnum:
      type: string
      enum:
        - success
        - error
        - forbidden
        - notfound
    ResponseError:
      type: object
      required:
        - status
        - error
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatusEnum'
        error:
          type: object
          properties:
            type:
              type: string
              examples:
                - error-router-no-match
            exception:
              type:
                - string
                - 'null'
    PaginationMeta:
      type: object
      required:
        - page
        - itemsPerPage
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
        itemsPerPage:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    Health:
      type: object
      required:
        - status
        - healthy
        - sync_paused
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatusEnum'
        healthy:
          type: boolean
        sync_paused:
          type: boolean
          description: 'The register is being modified; consumers that sync in the background are asked to hold off.'
    FunctionList:
      type: object
      additionalProperties:
        type: object
        properties:
          translations:
            type: object
            required:
              - en
              - nl
            properties:
              en:
                type: string
              nl:
                type: string
          isAdministrative:
            type: boolean
          isLegacy:
            type: boolean
  responses: {}
  parameters: {}
  examples: {}
  requestBodies: {}
  headers: {}
  securitySchemes:
    api_auth:
      type: http
      description: 'The token of a GEWIS API principal.'
      scheme: bearer
security:
  -
    api_auth: []
tags:
  -
    name: Activity
    description: 'An activity, as its live (approved) revision describes it. A cancelled activity is still listed, with `cancelled` set; one the board unpublished is not listed at all. Every human-readable field is an {en, nl} pair, and a value the organiser never filled in is null rather than substituted from the other language.'
  -
    name: BoardMember
    description: 'A board installation. Current ones by default; `includeFormer` asks for the boards that came before.'
  -
    name: Body
    description: 'A body of the association: a committee, a fraternity, an advisory board, or any other organ a decision founded. The register calls it an organ; the API calls it a body. An abbreviation is reused when a body is founded again years later, so the identifier is the only stable handle on one.'
  -
    name: BodyMember
    description: 'A member installed in a body, seen from the body. A member holding two functions in the same body is two rows.'
  -
    name: Keyholder
    description: "A member holding a key to the association's rooms. Currently valid grants by default; `includeExpired` asks for the ones that have run out or been withdrawn."
  -
    name: MailingList
    description: 'A mailing list of the association. The name is its identifier, and it is case-sensitive.'
  -
    name: MailingListMember
    description: 'A subscription to a mailing list. A member subscribed under two addresses is two rows, which is why the membership number does not identify one.'
  -
    name: Member
    description: 'A member of the association. Which fields are present depends on the permissions the token carries: a field it may not see is absent rather than null.'
  -
    name: MemberBody
    description: 'A member installed in a body, seen from the member.'
  -
    name: PhotoAlbum
    description: "A published photo album. Sub-albums are listed alongside their parents and carry their parent's identifier, so a consumer can rebuild the tree from one listing."
  -
    name: AlbumPhoto
    description: 'A photo in a published album. Reached through its album, which is what decides whether it may be seen.'
  -
    name: PhotoOfTheWeek
    description: 'The photo the association voted best of the week that just passed. Its public copy needs no token; a hidden photo of the week is a missing resource.'
externalDocs:
  description: 'Contribute to this API'
  url: 'https://github.com/GEWIS/radix'
webhooks: {}
